<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Void — Entropy Garden</title>
  <meta name="description" content="A standalone Entropy Garden installation: helix, pyramid, and alchemical sigils in the void.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='rotate(90 50 50)'><path d='M 10 50 C 30 20, 70 20, 90 50 C 70 80, 30 80, 10 50 Z' stroke='%230f0' stroke-width='4' fill='none' stroke-linejoin='round'/><circle cx='50' cy='50' r='24' stroke='%230f0' stroke-width='1.5' fill='none'/><circle cx='50' cy='50' r='14' stroke='%230f0' stroke-width='2' fill='none'/><circle cx='50' cy='50' r='5' fill='%230f0'/></g></svg>">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--void-black);
      color: #fff;
      font-family: var(--main-font);
      color-scheme: dark;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Soft garden atmosphere — same plate, quieter than the main SPA */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(0, 40, 12, 0.35), transparent 70%),
        url('../assets/img/backgrounds/bkgrnd.webp') center / cover no-repeat;
      opacity: 0.14;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0, 255, 0, 0.018) 1px, transparent 1px);
      background-size: 100% 3px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: soft-light;
    }

    .chrome {
      position: fixed;
      z-index: 4;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(0, 255, 0, 0.72);
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.28);
      pointer-events: none;
      user-select: none;
    }

    .chrome-tl { top: max(16px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); }
    .chrome-tr { top: max(16px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); text-align: right; }
    .chrome-bl { bottom: max(16px, env(safe-area-inset-bottom)); left: max(18px, env(safe-area-inset-left)); }
    .chrome strong { font-weight: 600; color: rgba(0, 255, 0, 0.92); }
    .chrome .dim { color: rgba(0, 255, 0, 0.42); letter-spacing: 0.18em; }

    .void-clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 0 16px 22px;
      transition: opacity 0.35s ease;
    }
    .void-clock.is-jumping { opacity: 0.28; }
    .void-clock-face {
      font-size: clamp(28px, 6.5vw, 72px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #fff;
      text-shadow:
        0 0 24px rgba(255, 255, 255, 0.12),
        0 0 1px rgba(255, 255, 255, 0.5);
      font-variant-numeric: tabular-nums;
      max-width: min(94vw, 920px);
      word-break: break-word;
    }
    .void-clock-face.is-extreme {
      letter-spacing: -0.02em;
      text-shadow:
        0 0 28px rgba(0, 255, 0, 0.22),
        0 0 2px rgba(255, 255, 255, 0.55);
    }
    .void-clock-date {
      font-size: clamp(0.62rem, 1.8vw, 0.78rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
      max-width: min(90vw, 420px);
      line-height: 1.4;
    }

    .void-comment {
      position: relative;
      z-index: 3;
      margin: 0 auto 8px;
      max-width: min(92vw, 420px);
      min-height: 2.8em;
      padding: 0 12px;
      font-size: clamp(0.68rem, 2.2vw, 0.78rem);
      line-height: 1.45;
      letter-spacing: 0.04em;
      color: rgba(200, 255, 210, 0.78);
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.18);
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .void-comment.is-visible { opacity: 1; }

    #sigils { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    main {
      position: relative;
      z-index: 3;
      width: 100%;
      text-align: center;
      padding: 72px 20px 88px;
    }

    .sculptures {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 0 auto;
      gap: 18px;
    }

    canvas { display: block; min-width: 0; }
    #helix { width: clamp(150px, 30vw, 336px); height: clamp(40px, 5.5vw, 62px); }
    #pyramid { width: min(90vw, 480px); height: min(90vw, 430px); }

    .garden-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 10px 16px;
      border: 1px solid rgba(0, 255, 0, 0.35);
      border-radius: var(--radius-sm);
      background: rgba(0, 12, 0, 0.55);
      color: rgba(0, 255, 0, 0.88);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .garden-link:hover,
    .garden-link:focus-visible {
      color: #050505;
      background: var(--neon-green);
      border-color: var(--neon-green);
      text-shadow: none;
      box-shadow: 0 0 22px rgba(0, 255, 0, 0.35);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      body::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="chrome chrome-tl" aria-hidden="true">
    <strong>Entropy Garden</strong><br>
    <span class="dim">// node · the-void</span>
  </div>
  <div class="chrome chrome-tr" aria-hidden="true">

  <main>
    <h1 class="void-clock" id="void-clock" aria-live="polite">
      <span class="void-clock-face" id="void-clock-face">Tue · Nov 4 · 2025</span>
      <span class="void-clock-date" id="void-clock-date">· just a Tuesday ·</span>
    </h1>
    <div class="sculptures">
      <canvas id="helix" role="img" aria-label="A horizontal spinning white double helix beneath the title">A spinning double helix.</canvas>
      <canvas id="pyramid" role="img" aria-label="A rotating black pyramid in three slightly separated tiers making random quarter turns with white edges and an eye icon on the capstone">A rotating three-tier pyramid with white edges.</canvas>
    </div>
    <p id="void-comment" class="void-comment" aria-live="polite"></p>
    <a class="garden-link" href="../index.html">← // return to the garden</a>
  </main>
  <script>
    const VOID_WELCOMES = [
      "welcome to the void: the uncomfortable silence is free of charge",
      "welcome to the void: please have a seat while we do nothing in particular",
      "welcome to the void she left behind",
      "welcome to the void: object impermanence contemplated. fetal position assumed",

      "welcome to the void: feel the lack of presence from the comfort of your fancy rectangle!",

      "welcome to the void: please don’t litter. it kinda defeats the point",

      "welcome to the void: side effects may include existential dread and disorientation",
      "welcome to the void: we’re glad you’re here and not here",
      "welcome to the void: the temporal geometry may be nonclassical, but the vibes are undeniable",
      "welcome to the void: the perfect destination to reflect on how weird you are",

      "welcome to the void: please keep your socks on at all times",
      "welcome to the void: the fabric of spacetime is especially unpredictable at this time. kindly reset your watches",
      "welcome to the void: please try again",
      "welcome to the void: feel your sense of self dissolve into the infinite vacuum",
      "welcome to the void: hope you brought a jacket",
      "welcome to the void: where nothing lasts forever",
      "welcome to the void: the undisputed champion of the silence game",
      "welcome to the void: the homing beacon is more than unlikely to bring you back to the garden",
      "welcome to the void: inspired by the GTA 6 delays",
      "welcome to the void: finally, a vacuum that doesn’t wake you up in the morning",
      "welcome to the void: abstraction distilled into an attraction",
      "welcome to the void: the only instance of persistence",
    ];

    /** Mundane dates pad the pool so cosmic extremes hit harder. */
    const MUNDANE_EPOCHS = [
      { when: 'Tue · Nov 4 · 2025', note: 'just a Tuesday' },
      { when: 'Wed · 9:41 AM', note: 'phone lock screen hour' },
      { when: 'Thu · after lunch', note: 'digesting' },
      { when: 'Fri · 4:59 PM', note: 'almost weekend' },
      { when: 'Mon · morning', note: 'again' },
      { when: 'last Tuesday', note: 'still unpaid' },
      { when: 'next Thursday', note: 'calendar invite pending' },
      { when: 'yesterday', note: 'already gone' },
      { when: 'tomorrow morning', note: 'alarm set' },
      { when: 'noonish', note: 'sandwich window' },
      { when: 'half past whenever', note: 'clocks disagree' },
      { when: 'Apr 15', note: 'tax day' },
      { when: 'Jan 1 · 12:01 AM', note: 'resolution already broken' },
      { when: 'Feb 29 · 2028', note: 'leap day errand' },
      { when: 'Oct 32', note: 'invalid; proceed anyway' },
      { when: 'Dec 31 · 11:59 PM', note: 'countdown energy' },
      { when: '1997', note: 'dial-up nostalgia' },
      { when: 'Y2K', note: 'everyone survived' },
      { when: 'Q3', note: 'earnings call' },
      { when: 'Black Friday', note: 'parking lot combat' },
      { when: 'daylight saving again', note: 'who asked' },
      { when: 'password expires Friday', note: 'you will forget' },
      { when: 'oil change due', note: 'sticker on windshield' },
      { when: 'dentist · 2:30', note: 'floss theater' },
      { when: 'grocery run', note: 'milk and regret' },
      { when: 'rush hour', note: 'standstill' },
      { when: 'coffee o’clock', note: 'third cup' },
      { when: '2 weeks notice', note: 'awkward hallway' },
      { when: 'lease renewal', note: 'fine print' },
      { when: 'last fiscal year', note: 'spreadsheet haunt' },
      { when: 'midterms', note: 'caffeine cosmology' },
      { when: 'spring cleaning', note: 'one drawer done' },
      { when: 'your birthday · approx.', note: 'cake TBD' },
      { when: 'five minutes ago', note: 'already lore' },
      { when: 'the weekend', note: 'theoretical' },
      { when: 'EST / PST', note: 'wrong call again' },
      { when: 'Wed · Mar 12 · 2014', note: 'uneventful' },
      { when: 'Sat · Aug 9 · 2003', note: 'also uneventful' },
      { when: 'Sun · 7:12 AM', note: 'too early' },
      { when: 'Thu · 3:14 PM', note: 'pi-adjacent boredom' },
      { when: 'sometime this month', note: 'vague commitment' },
      { when: 'end of the week', note: 'moving target' },
      { when: 'before noon', note: 'optimistic' },
      { when: 'after the meeting', note: 'another meeting' },
      { when: 'hold music era', note: 'still on hold' },
    ];

    /** Extreme eras: Big Bang → heat death, with obscure glyphs. */
    const EXTREME_EPOCHS = [
      { symbol: '✶', when: 't ≈ 0', note: 'Planck epoch' },
      { symbol: '⊙', when: '−13.8 BYA', note: 'big bang' },
      { symbol: '🜨', when: '−13.8 BYA + 10⁻³² s', note: 'inflation' },
      { symbol: '⊗', when: '−13.7 BYA', note: 'recombination' },
      { symbol: '🜍', when: '−13.2 BYA', note: 'first light' },
      { symbol: '☉', when: '−4.6 BYA', note: 'solar ignition' },
      { symbol: '🜚', when: '−3.8 BYA', note: 'abiogenesis?' },
      { symbol: 'ᛟ', when: '−300 MYA', note: 'pangaea' },
      { symbol: '𓃭', when: '−66 MYA', note: 'K–Pg boundary' },
      { symbol: '☿', when: '−300 KYA', note: 'sapiens' },
      { symbol: '☉', when: '0 CE', note: 'arbitrary zero' },
      { symbol: '⌬', when: '2026 CE', note: 'now-ish' },
      { symbol: '🝆', when: '+1 MYA', note: 'next ice' },
      { symbol: '☿', when: '+5 BYA', note: 'red giant sun' },
      { symbol: '∅', when: '+10¹⁴ yr', note: 'star death' },
      { symbol: 'ℵ', when: '+10³⁴ yr', note: 'proton decay?' },
      { symbol: 'Ω', when: '+10¹⁰⁰ yr', note: 'heat death' },
      { symbol: '∴', when: 'τ → ∞', note: 'after heat' },
    ];
    const OBSCURE_DIGITS = ['᛫', '·', '∴', '∵', '∷', '∶', '⌀', 'ø', '⊙', '⊗', '⊕', '⊖', '⊘', '⊚', '○', '●', '◦', '¤', '†', '‡', '※', '⁂', '⁕'];

    const voidCommentEl = document.getElementById('void-comment');
    const voidClockEl = document.getElementById('void-clock');
    const voidClockFace = document.getElementById('void-clock-face');
    const voidClockDate = document.getElementById('void-clock-date');
    let lastEpochKey = '';

    function pickVoid(list, avoid) {
      if (!list.length) return '';
      if (list.length === 1) return list[0];
      let next = list[Math.floor(Math.random() * list.length)];
      let guard = 0;
      while (next === avoid && guard++ < 8) {
        next = list[Math.floor(Math.random() * list.length)];
      }
      return next;
    }

    function obscureTimeFragment() {
      const parts = [];
      const count = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        parts.push(OBSCURE_DIGITS[Math.floor(Math.random() * OBSCURE_DIGITS.length)]);
      }
      return parts.join('');
    }

    function prefersReducedMotion() {
      return matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function pickEpoch() {
      // Mostly mundane so extremes feel like a glitch in the calendar.
      const useExtreme = Math.random() < 0.22;
      const pool = useExtreme ? EXTREME_EPOCHS : MUNDANE_EPOCHS;
      let epoch = pool[Math.floor(Math.random() * pool.length)];
      let key = `${epoch.when}|${epoch.note}`;
      let guard = 0;
      while (key === lastEpochKey && guard++ < 8) {
        epoch = pool[Math.floor(Math.random() * pool.length)];
        key = `${epoch.when}|${epoch.note}`;
      }
      lastEpochKey = key;
      return { epoch, extreme: useExtreme };
    }

    function renderCosmicClock() {
      const { epoch, extreme } = pickEpoch();
      const face = extreme && epoch.symbol
        ? `${epoch.symbol}  ${epoch.when}`
        : epoch.when;
      const date = extreme
        ? `${obscureTimeFragment()} · ${epoch.note} · ${obscureTimeFragment()}`
        : `· ${epoch.note} ·`;
      if (voidClockEl) voidClockEl.classList.add('is-jumping');
      globalThis.setTimeout?.(() => {
        if (voidClockFace) {
          voidClockFace.textContent = face;
          voidClockFace.classList.toggle('is-extreme', extreme);
        }
        if (voidClockDate) voidClockDate.textContent = date;
        voidClockEl?.classList.remove('is-jumping');
      }, prefersReducedMotion() ? 0 : 280);
    }

    function scheduleCosmicClockJump() {
      const wait = prefersReducedMotion()
        ? 12000 + Math.random() * 8000
        : 1800 + Math.random() * 9000;
      globalThis.setTimeout?.(() => {
        renderCosmicClock();
        scheduleCosmicClockJump();
      }, wait);
    }

    let lastVoidComment = '';
    function showVoidComment() {
      if (!voidCommentEl || !VOID_WELCOMES.length) return;
      const next = pickVoid(VOID_WELCOMES, lastVoidComment);
      lastVoidComment = next;
      voidCommentEl.classList.remove('is-visible');
      globalThis.setTimeout?.(() => {
        voidCommentEl.textContent = next;
        voidCommentEl.classList.add('is-visible');
      }, 320);
    }

    function scheduleVoidComment() {
      const wait = prefersReducedMotion()
        ? 14000 + Math.random() * 8000
        : 7000 + Math.random() * 9000;
      globalThis.setTimeout?.(() => {
        showVoidComment();
        scheduleVoidComment();
      }, wait);
    }

    const canvas = document.querySelector('#pyramid');
    const context = canvas.getContext('2d');
    const helixCanvas = document.querySelector('#helix');
    const helixContext = helixCanvas.getContext('2d');
    let helixAngle = 0;
    function drawHelix(elapsed) {
      if (!reducedMotion.matches) helixAngle += elapsed * 0.0006;
      const {width, height} = helixCanvas.getBoundingClientRect();
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (helixCanvas.width !== Math.round(width * ratio) || helixCanvas.height !== Math.round(height * ratio)) {
        helixCanvas.width = Math.round(width * ratio);
        helixCanvas.height = Math.round(height * ratio);
      }
      helixContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      helixContext.clearRect(0, 0, width, height);
      const radius = height * 0.28;
      const span = width * 0.90;
      const point = (t, strand) => {
        const theta = t * Math.PI * 3 + helixAngle + strand * Math.PI;
        return [width * 0.5 + (t - 0.5) * span,
          height * 0.5 + Math.cos(theta) * radius,
          Math.sin(theta)];
      };
      const segments = [];
      for (let strand = 0; strand < 2; strand++) {
        for (let step = 0; step < 180; step++) {
          segments.push({a: point(step / 180, strand), b: point((step + 1) / 180, strand), rung: false});
        }
      }
      for (let step = 0; step <= 8; step++) {
        segments.push({a: point(step / 8, 0), b: point(step / 8, 1), rung: true});
      }
      segments.sort((a, b) => a.a[2] + a.b[2] - b.a[2] - b.b[2]);
      helixContext.lineCap = 'round';
      for (const {a, b, rung} of segments) {
        helixContext.strokeStyle = 'rgba(220, 255, 220, 0.95)';
        helixContext.lineWidth = rung ? 1.2 : 2;
        helixContext.beginPath();
        helixContext.moveTo(a[0], a[1]);
        helixContext.lineTo(b[0], b[1]);
        helixContext.stroke();
      }
    }
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const sigilCanvas = document.querySelector('#sigils');
    const sigilContext = sigilCanvas.getContext('2d');
    const alchemicalSymbols = Array.from({length: 116}, (_, index) => String.fromCodePoint(0x1F700 + index));
    const sigils = [];
    let nextSigil = 0;
    function createSigil() {
      return {
        x: 0.06 + Math.random() * 0.88,
        y: 0.08 + Math.random() * 0.84,
        size: 35 + Math.random() * 65,
        rotation: (Math.random() - 0.5) * 0.6,
        age: 0, life: 5000 + Math.random() * 5000,
        symbol: alchemicalSymbols[Math.floor(Math.random() * alchemicalSymbols.length)]
      };
    }
    function drawSigils(elapsed) {
      const width = innerWidth, height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (sigilCanvas.width !== Math.round(width * ratio) || sigilCanvas.height !== Math.round(height * ratio)) {
        sigilCanvas.width = Math.round(width * ratio);
        sigilCanvas.height = Math.round(height * ratio);
      }
      sigilContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      sigilContext.clearRect(0, 0, width, height);
      if (reducedMotion.matches) return;
      nextSigil -= elapsed;
      if (nextSigil <= 0 && sigils.length < 7) {
        sigils.push(createSigil());
        nextSigil = 1100 + Math.random() * 1400;
      }
      for (let index = sigils.length - 1; index >= 0; index--) {
        const sigil = sigils[index];
        sigil.age += elapsed;
        if (sigil.age >= sigil.life) { sigils.splice(index, 1); continue; }
        const fade = Math.sin(Math.PI * sigil.age / sigil.life) ** 2;
        sigilContext.save();
        sigilContext.translate(sigil.x * width, sigil.y * height);
        sigilContext.rotate(sigil.rotation);
        const size = Math.min(sigil.size, width * 0.18);
        sigilContext.fillStyle = 'rgba(255,255,255,' + (fade * 0.18) + ')';
        sigilContext.font = size + 'px "Apple Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", serif';
        sigilContext.textAlign = 'center';
        sigilContext.textBaseline = 'middle';
        sigilContext.fillText(sigil.symbol, 0, 0);
        sigilContext.restore();
      }
    }
    const faces = [];
    const ring = (t, lift) => [
      [-t, 1 - 2 * t + lift, -t],
      [t, 1 - 2 * t + lift, -t],
      [t, 1 - 2 * t + lift, t],
      [-t, 1 - 2 * t + lift, t]
    ];
    for (let tier = 0; tier < 3; tier++) {
      const lift = (1 - tier) * 0.20;
      const top = ring(tier / 3, lift);
      const bottom = ring((tier + 1) / 3, lift);
      for (let side = 0; side < 4; side++) {
        const next = (side + 1) % 4;
        faces.push({tier, eye: tier === 0 && side === 2, points: [top[side], top[next], bottom[next], bottom[side]]});
      }
      if (tier > 0) faces.push({tier, points: [...top].reverse()});
      faces.push({tier, points: bottom});
    }
    const angles = [0.45, 0.45, 0.45];
    const randomPause = () => 900 + Math.random() * 2800;
    const turns = angles.map(angle => ({
      start: angle, target: angle, elapsed: 0,
      duration: 750, waiting: randomPause(), moving: false
    }));
    function updateLayers(elapsed) {
      if (reducedMotion.matches) return;
      turns.forEach((turn, tier) => {
        if (!turn.moving) {
          turn.waiting -= elapsed;
          if (turn.waiting > 0) return;
          turn.start = angles[tier];
          turn.target = turn.start + (Math.random() < 0.5 ? -1 : 1) * Math.PI / 2;
          turn.elapsed = 0;
          turn.duration = 650 + Math.random() * 350;
          turn.moving = true;
        }
        turn.elapsed = Math.min(turn.elapsed + elapsed, turn.duration);
        const t = turn.elapsed / turn.duration;
        const eased = t * t * (3 - 2 * t);
        angles[tier] = turn.start + (turn.target - turn.start) * eased;
        if (t === 1) {
          angles[tier] = turn.target;
          turn.moving = false;
          turn.waiting = randomPause();
        }
      });
    }
    const blink = {waiting: 1800 + Math.random() * 4200, elapsed: 0, active: false, openness: 1};
    function updateBlink(elapsed) {
      if (reducedMotion.matches) { blink.openness = 1; return; }
      if (!blink.active) {
        blink.waiting -= elapsed;
        if (blink.waiting > 0) return;
        blink.active = true;
        blink.elapsed = 0;
      }
      blink.elapsed += elapsed;
      // Close quickly, hold briefly, then open a little more slowly.
      const t = blink.elapsed;
      blink.openness = t < 85 ? 1 - t / 85 : t < 120 ? 0 : Math.min(1, (t - 120) / 125);
      if (t >= 245) {
        blink.active = false;
        blink.openness = 1;
        blink.waiting = 2200 + Math.random() * 4800;
      }
    }
    let previousTime;
    function draw(time) {
      const elapsed = previousTime === undefined ? 0 : Math.min(time - previousTime, 50);
      previousTime = time;
      drawHelix(elapsed);
      updateLayers(elapsed);
      updateBlink(elapsed);
      drawSigils(elapsed);
      const {width, height} = canvas.getBoundingClientRect();
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      function project([x, y, z], angle) {
        const rx = x * Math.cos(angle) + z * Math.sin(angle);
        const rz = -x * Math.sin(angle) + z * Math.cos(angle);
        const ry = y * Math.cos(0.08) - rz * Math.sin(0.08);
        const depth = y * Math.sin(0.08) + rz * Math.cos(0.08);
        const scale = Math.min(width, height) * 0.25;
        return [width / 2 + rx * scale, height * 0.46 - ry * scale, depth];
      }
      // Discard rear faces before depth sorting so hidden caps cannot
      // paint across the visible sides of another tier.
      const projected = faces
        .map(({tier, points, eye}) => Object.assign(points.map(point => project(point, angles[tier])), {eye}))
        .filter(face => {
          const signedArea = face.reduce((sum, point, index) => {
            const next = face[(index + 1) % face.length];
            return sum + point[0] * next[1] - next[0] * point[1];
          }, 0);
          return signedArea < -0.001;
        });
      const averageDepth = face => face.reduce((sum, point) => sum + point[2], 0) / face.length;
      projected.sort((a, b) => averageDepth(a) - averageDepth(b));
      context.lineWidth = 1.4;
      context.lineJoin = 'round';
      for (const face of projected) {
        context.beginPath();
        face.forEach(([x, y], index) => index === 0 ? context.moveTo(x, y) : context.lineTo(x, y));
        context.closePath();
        context.fillStyle = '#050505';
        context.fill();
        context.strokeStyle = 'rgba(220, 255, 220, 0.92)';
        context.stroke();
        if (face.eye) {
          // Draw on the capstone's front plane so the eye follows its rotation.
          const eyePoint = (x, y) => {
            const lidY = 0.76 + (y - 0.76) * blink.openness;
            return project([x, lidY, (1.2 - lidY) / 2], angles[0]);
          };
          const trace = (points, fill) => {
            context.beginPath();
            points.forEach(([x, y], index) => {
              const [px, py] = eyePoint(x, y);
              if (index === 0) context.moveTo(px, py);
              else context.lineTo(px, py);
            });
            context.closePath();
            if (fill) {
              context.fillStyle = fill;
              context.fill();
            } else context.stroke();
          };
          const outline = [];
          for (let step = 0; step <= 32; step++) {
            const t = step / 32;
            outline.push([-0.14 + 0.28 * t, 0.76 + 0.065 * Math.sin(Math.PI * t)]);
          }
          for (let step = 32; step >= 0; step--) {
            const t = step / 32;
            outline.push([-0.14 + 0.28 * t, 0.76 - 0.065 * Math.sin(Math.PI * t)]);
          }
          trace(outline, 'rgba(230, 255, 230, 0.95)');
          trace(Array.from({length: 49}, (_, index) => {
            const theta = index / 48 * Math.PI * 2;
            return [0.038 * Math.cos(theta), 0.76 + 0.038 * Math.sin(theta)];
          }), '#050505');
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    renderCosmicClock();
    scheduleCosmicClockJump();
    showVoidComment();
    scheduleVoidComment();
  </script>
</body>
</html>
