      { when: '1945', note: 'the UN accomplishes something but we\'re not sure what' },

      { when: '1947–1991', note: 'the threat of nuclear war ruins the potluck' },
      { when: '1954–1968', note: 'a dude has a dream. the FBI takes it personally' },
      { when: 'July 20, 1969', note: 'astronauts discover firsthand that the moon is not made of cheese' },
      { when: 'November 9, 1989', note: 'German graffiti artist asks everyone to leave his tag up' },
      { when: 'November 9, 1989', note: 'Germany collectively loses its shit over public property damage' },
      { when: '1989', note: 'you don\'t need magazines anymore' },
      { when: '2001', note: 'the world was never the same... again' },
      { when: '2020s', note: 'the glowing rectangles are getting scary' },
      { when: 'WW3', note: 'sooner than you’d think' },
      { when: 'WW4', note: 'Trump didn’t like the election results' },
    ];

    /** Extreme eras: Big Bang → heat death, with obscure glyphs. */
    const EXTREME_EPOCHS = [
      { symbol: '✶', when: 't ≈ 0', note: 'Planck epoch' },
      { symbol: '⊙', when: '−13.8 BYA', note: 'big bang' },
      { symbol: '🜨', when: '−13.8 BYA + 10⁻³² s', note: 'inflation' },
      { symbol: '⊗', when: '−13.7 BYA', note: 'recombination' },
      { symbol: '🜍', when: '−13.2 BYA', note: 'first light' },
      { symbol: '☉', when: '−4.6 BYA', note: 'solar ignition' },
      { symbol: '🜚', when: '−3.8 BYA', note: 'abiogenesis?' },
      { symbol: 'ᛟ', when: '−300 MYA', note: 'pangaea' },
      { symbol: '𓃭', when: '−66 MYA', note: 'K–Pg boundary' },
      { symbol: '☿', when: '−300 KYA', note: 'sapiens' },
      { symbol: '☉', when: '0 CE', note: 'arbitrary zero' },
      { symbol: '⌬', when: '2026 CE', note: 'now-ish' },
      { symbol: '🝆', when: '+1 MYA', note: 'next ice' },
      { symbol: '☿', when: '+5 BYA', note: 'red giant sun' },
      { symbol: '☉', when: '+5 BYA', note: 'the world was never the same. literally' },
      { symbol: '∅', when: '+10¹⁴ yr', note: 'star death' },
      { symbol: 'ℵ', when: '+10³⁴ yr', note: 'proton decay?' },
      { symbol: 'Ω', when: '+10¹⁰⁰ yr', note: 'heat death' },
      { symbol: '∴', when: 'τ → ∞', note: 'after heat' },
    ];
    /** Loaded from Mr. Disco’s alternate-history archive. */
    let TIMELINE_EPOCHS = [];
    const OBSCURE_DIGITS = ['᛫', '·', '∴', '∵', '∷', '∶', '⌀', 'ø', '⊙', '⊗', '⊕', '⊖', '⊘', '⊚', '○', '●', '◦', '¤', '†', '‡', '※', '⁂', '⁕'];

    const voidCommentEl = document.getElementById('void-comment');
    const voidClockEl = document.getElementById('void-clock');
    const voidClockFace = document.getElementById('void-clock-face');
    const voidClockDate = document.getElementById('void-clock-date');
    let lastEpochKey = '';

    function pickVoid(list, avoid) {
      if (!list.length) return '';
      if (list.length === 1) return list[0];
      let next = list[Math.floor(Math.random() * list.length)];
      let guard = 0;
      while (next === avoid && guard++ < 8) {
        next = list[Math.floor(Math.random() * list.length)];
      }
      return next;
    }

    function obscureTimeFragment() {
      const parts = [];
      const count = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        parts.push(OBSCURE_DIGITS[Math.floor(Math.random() * OBSCURE_DIGITS.length)]);
      }
      return parts.join('');
    }

    function prefersReducedMotion() {
      return matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function loadTimelineEpochs() {
      return fetch('../content/index.json')
        .then((res) => {
          if (!res.ok) throw new Error(`timeline index: ${res.status}`);
          return res.json();
        })
        .then((articles) => {
          if (!Array.isArray(articles)) return;
          TIMELINE_EPOCHS = articles
            .filter((a) => a && (a.title || a.year))
            .map((a) => ({
              when: String(a.title || a.year).trim(),
              note: String(a.year || 'alternate timeline').trim(),
              timeline: true,
            }));
        })
        .catch(() => {
          TIMELINE_EPOCHS = [];
        });
    }

    function pickEpoch() {
      // Mundane baseline, alternate timelines often, ruptures/extremes as glitches.
      const roll = Math.random();
      let pool = MUNDANE_EPOCHS;
      let extreme = false;
      let timeline = false;
      if (roll < 0.16) {
        pool = EXTREME_EPOCHS;
        extreme = true;
      } else if (roll < 0.28) {
        pool = RUPTURE_EPOCHS;
      } else if (roll < 0.62 && TIMELINE_EPOCHS.length) {
        pool = TIMELINE_EPOCHS;
        timeline = true;
      }
      let epoch = pool[Math.floor(Math.random() * pool.length)];
      let key = `${epoch.when}|${epoch.note}`;
      let guard = 0;
      while (key === lastEpochKey && guard++ < 8) {
        epoch = pool[Math.floor(Math.random() * pool.length)];
        key = `${epoch.when}|${epoch.note}`;
      }
      lastEpochKey = key;
      return { epoch, extreme, timeline };
    }

    function renderCosmicClock() {
      const { epoch, extreme, timeline } = pickEpoch();
      const face = extreme && epoch.symbol
        ? `${epoch.symbol}  ${epoch.when}`
        : epoch.when;
      const date = extreme
        ? `${obscureTimeFragment()} · ${epoch.note} · ${obscureTimeFragment()}`
        : `· ${epoch.note} ·`;
      if (voidClockEl) voidClockEl.classList.add('is-jumping');
      globalThis.setTimeout?.(() => {
        if (voidClockFace) {
          voidClockFace.textContent = face;
          voidClockFace.classList.toggle('is-extreme', extreme);
          voidClockFace.classList.toggle('is-timeline', Boolean(timeline));
        }
        if (voidClockDate) voidClockDate.textContent = date;
        voidClockEl?.classList.remove('is-jumping');
      }, prefersReducedMotion() ? 0 : 280);
    }

    function scheduleCosmicClockJump() {
      const wait = prefersReducedMotion()
        ? 12000 + Math.random() * 8000
        : 1800 + Math.random() * 9000;
      globalThis.setTimeout?.(() => {
        renderCosmicClock();
        scheduleCosmicClockJump();
      }, wait);
    }

    let lastVoidComment = '';
    let voidCommentTimer = 0;
    let denySubTimer = 0;
    let lastRandomDeny = '';
    let activeDenySequence = null;
    let activeWelcomeSequence = null;
    const gardenLink = document.getElementById('garden-link');
    const gardenLinkSub = document.getElementById('garden-link-sub');

    function nextVoidWelcome() {
      if (activeWelcomeSequence) {
        const line = activeWelcomeSequence.lines[activeWelcomeSequence.index++];
        if (activeWelcomeSequence.index >= activeWelcomeSequence.lines.length) {
          activeWelcomeSequence = null;
        }
        return line;
      }
      const choices = [
        ...VOID_WELCOMES.map((text) => ({ kind: 'line', text })),
        ...VOID_WELCOME_SEQUENCES.map((lines) => ({ kind: 'seq', lines })),
      ];
      let pick = choices[Math.floor(Math.random() * choices.length)];
      let guard = 0;
      while (pick.kind === 'line' && pick.text === lastVoidComment && guard++ < 8) {
        pick = choices[Math.floor(Math.random() * choices.length)];
      }
      if (pick.kind === 'seq') {
        activeWelcomeSequence = { lines: pick.lines, index: 1 };
        return pick.lines[0];
      }
      return pick.text;
    }

    function showVoidComment(forced) {
      if (!voidCommentEl) return;
      const next = forced || nextVoidWelcome();
      if (!next) return;
      lastVoidComment = next;
      voidCommentEl.classList.remove('is-visible');
      globalThis.clearTimeout?.(voidCommentTimer);
      voidCommentTimer = globalThis.setTimeout?.(() => {
        voidCommentEl.textContent = next;
        voidCommentEl.classList.add('is-visible');
      }, 320) || 0;
    }

    function scheduleVoidComment() {
      // Keep multi-beat bits tighter so the punchline still lands.
      const inSequence = Boolean(activeWelcomeSequence);
      const wait = prefersReducedMotion()
        ? (inSequence ? 7000 : 14000) + Math.random() * (inSequence ? 4000 : 8000)
        : (inSequence ? 4200 : 7000) + Math.random() * (inSequence ? 2800 : 9000);
      globalThis.setTimeout?.(() => {
        showVoidComment();
        scheduleVoidComment();
      }, wait);
    }

    function nextReturnDenyMessage() {
      if (activeDenySequence) {
        const line = activeDenySequence.lines[activeDenySequence.index++];
        if (activeDenySequence.index >= activeDenySequence.lines.length) {
          activeDenySequence = null;
        }
        return line;
      }
      // Sequence starts share the pick pool with one-off denials.
      const choices = [
        ...RETURN_DENY_RANDOM.map((text) => ({ kind: 'line', text })),
        ...RETURN_DENY_SEQUENCES.map((lines) => ({ kind: 'seq', lines })),
      ];
      let pick = choices[Math.floor(Math.random() * choices.length)];
      let guard = 0;
      while (pick.kind === 'line' && pick.text === lastRandomDeny && guard++ < 8) {
        pick = choices[Math.floor(Math.random() * choices.length)];
      }
      if (pick.kind === 'seq') {
        activeDenySequence = { lines: pick.lines, index: 1 };
        return pick.lines[0];
      }
      lastRandomDeny = pick.text;
      return pick.text;
    }

    function showReturnDenySubtitle(message) {
      if (!gardenLinkSub) return;
      gardenLinkSub.textContent = message;
      gardenLinkSub.classList.add('is-visible');
      globalThis.clearTimeout?.(denySubTimer);
      denySubTimer = globalThis.setTimeout?.(() => {
        gardenLinkSub.classList.remove('is-visible');
      }, 3200) || 0;
    }

    gardenLink?.addEventListener('click', (event) => {
      // Finish scripted teases before allowing a lucky escape.
      if (!activeDenySequence && Math.random() < 0.1) return;
      event.preventDefault();
      showReturnDenySubtitle(nextReturnDenyMessage());
    });

    const canvas = document.querySelector('#pyramid');
    const context = canvas.getContext('2d');
    const helixCanvas = document.querySelector('#helix');
    const helixContext = helixCanvas.getContext('2d');
    let helixAngle = 0;
    function drawHelix(elapsed) {
      if (!reducedMotion.matches) helixAngle += elapsed * 0.0006;
      const {width, height} = helixCanvas.getBoundingClientRect();
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (helixCanvas.width !== Math.round(width * ratio) || helixCanvas.height !== Math.round(height * ratio)) {
        helixCanvas.width = Math.round(width * ratio);
        helixCanvas.height = Math.round(height * ratio);
      }
      helixContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      helixContext.clearRect(0, 0, width, height);
      const radius = height * 0.28;
      const span = width * 0.90;
      const point = (t, strand) => {
        const theta = t * Math.PI * 3 + helixAngle + strand * Math.PI;
        return [width * 0.5 + (t - 0.5) * span,
          height * 0.5 + Math.cos(theta) * radius,
          Math.sin(theta)];
      };
      const segments = [];
      for (let strand = 0; strand < 2; strand++) {
        for (let step = 0; step < 180; step++) {
          segments.push({a: point(step / 180, strand), b: point((step + 1) / 180, strand), rung: false});
        }
      }
      for (let step = 0; step <= 8; step++) {
        segments.push({a: point(step / 8, 0), b: point(step / 8, 1), rung: true});
      }
      segments.sort((a, b) => a.a[2] + a.b[2] - b.a[2] - b.b[2]);
      helixContext.lineCap = 'round';
      for (const {a, b, rung} of segments) {
        helixContext.strokeStyle = '#fff';
        helixContext.lineWidth = rung ? 1.2 : 2;
        helixContext.beginPath();
        helixContext.moveTo(a[0], a[1]);
        helixContext.lineTo(b[0], b[1]);
        helixContext.stroke();
      }
    }
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const sigilCanvas = document.querySelector('#sigils');
    const sigilContext = sigilCanvas.getContext('2d');
    const alchemicalSymbols = Array.from({length: 116}, (_, index) => String.fromCodePoint(0x1F700 + index));
    const sigils = [];
    let nextSigil = 0;
    function createSigil() {
      return {
        x: 0.06 + Math.random() * 0.88,
        y: 0.08 + Math.random() * 0.84,
        size: 35 + Math.random() * 65,
        rotation: (Math.random() - 0.5) * 0.6,
        age: 0, life: 5000 + Math.random() * 5000,
        symbol: alchemicalSymbols[Math.floor(Math.random() * alchemicalSymbols.length)]
      };
    }
    function drawSigils(elapsed) {
      const width = innerWidth, height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (sigilCanvas.width !== Math.round(width * ratio) || sigilCanvas.height !== Math.round(height * ratio)) {
        sigilCanvas.width = Math.round(width * ratio);
        sigilCanvas.height = Math.round(height * ratio);
      }
      sigilContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      sigilContext.clearRect(0, 0, width, height);
      if (reducedMotion.matches) return;
      nextSigil -= elapsed;
      if (nextSigil <= 0 && sigils.length < 7) {
        sigils.push(createSigil());
        nextSigil = 1100 + Math.random() * 1400;
      }
      for (let index = sigils.length - 1; index >= 0; index--) {
        const sigil = sigils[index];
        sigil.age += elapsed;
        if (sigil.age >= sigil.life) { sigils.splice(index, 1); continue; }
        const fade = Math.sin(Math.PI * sigil.age / sigil.life) ** 2;
        sigilContext.save();
        sigilContext.translate(sigil.x * width, sigil.y * height);
        sigilContext.rotate(sigil.rotation);
        const size = Math.min(sigil.size, width * 0.18);
        sigilContext.fillStyle = 'rgba(255,255,255,' + (fade * 0.18) + ')';
        sigilContext.font = size + 'px "Apple Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", serif';
        sigilContext.textAlign = 'center';
        sigilContext.textBaseline = 'middle';
        sigilContext.fillText(sigil.symbol, 0, 0);
        sigilContext.restore();
      }
    }
    const faces = [];
    const ring = (t, lift) => [
      [-t, 1 - 2 * t + lift, -t],
      [t, 1 - 2 * t + lift, -t],
      [t, 1 - 2 * t + lift, t],
      [-t, 1 - 2 * t + lift, t]
    ];
    for (let tier = 0; tier < 3; tier++) {
      const lift = (1 - tier) * 0.20;
      const top = ring(tier / 3, lift);
      const bottom = ring((tier + 1) / 3, lift);
      for (let side = 0; side < 4; side++) {
        const next = (side + 1) % 4;
        faces.push({tier, eye: tier === 0 && side === 2, points: [top[side], top[next], bottom[next], bottom[side]]});
      }
      if (tier > 0) faces.push({tier, points: [...top].reverse()});
      faces.push({tier, points: bottom});
    }
    const angles = [0.45, 0.45, 0.45];
    const randomPause = () => 900 + Math.random() * 2800;
    const turns = angles.map(angle => ({
      start: angle, target: angle, elapsed: 0,
      duration: 750, waiting: randomPause(), moving: false
    }));
    function updateLayers(elapsed) {
      if (reducedMotion.matches) return;
      turns.forEach((turn, tier) => {
        if (!turn.moving) {
          turn.waiting -= elapsed;
          if (turn.waiting > 0) return;
          turn.start = angles[tier];
          turn.target = turn.start + (Math.random() < 0.5 ? -1 : 1) * Math.PI / 2;
          turn.elapsed = 0;
          turn.duration = 650 + Math.random() * 350;
          turn.moving = true;
        }
        turn.elapsed = Math.min(turn.elapsed + elapsed, turn.duration);
        const t = turn.elapsed / turn.duration;
        const eased = t * t * (3 - 2 * t);
        angles[tier] = turn.start + (turn.target - turn.start) * eased;
        if (t === 1) {
          angles[tier] = turn.target;
          turn.moving = false;
          turn.waiting = randomPause();
        }
      });
    }
    const blink = {waiting: 1800 + Math.random() * 4200, elapsed: 0, active: false, openness: 1};
    function updateBlink(elapsed) {
      if (reducedMotion.matches) { blink.openness = 1; return; }
      if (!blink.active) {
        blink.waiting -= elapsed;
        if (blink.waiting > 0) return;
        blink.active = true;
        blink.elapsed = 0;
      }
      blink.elapsed += elapsed;
      // Close quickly, hold briefly, then open a little more slowly.
      const t = blink.elapsed;
      blink.openness = t < 85 ? 1 - t / 85 : t < 120 ? 0 : Math.min(1, (t - 120) / 125);
      if (t >= 245) {
        blink.active = false;
        blink.openness = 1;
        blink.waiting = 2200 + Math.random() * 4800;
      }
    }
    let previousTime;
    function draw(time) {
      const elapsed = previousTime === undefined ? 0 : Math.min(time - previousTime, 50);
      previousTime = time;
      drawHelix(elapsed);
      updateLayers(elapsed);
      updateBlink(elapsed);
      drawSigils(elapsed);
      const {width, height} = canvas.getBoundingClientRect();
      const ratio = Math.min(devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      function project([x, y, z], angle) {
        const rx = x * Math.cos(angle) + z * Math.sin(angle);
        const rz = -x * Math.sin(angle) + z * Math.cos(angle);
        const ry = y * Math.cos(0.08) - rz * Math.sin(0.08);
        const depth = y * Math.sin(0.08) + rz * Math.cos(0.08);
        const scale = Math.min(width, height) * 0.25;
        return [width / 2 + rx * scale, height * 0.46 - ry * scale, depth];
      }
      // Discard rear faces before depth sorting so hidden caps cannot
      // paint across the visible sides of another tier.
      const projected = faces
        .map(({tier, points, eye}) => Object.assign(points.map(point => project(point, angles[tier])), {eye}))
        .filter(face => {
          const signedArea = face.reduce((sum, point, index) => {
            const next = face[(index + 1) % face.length];
            return sum + point[0] * next[1] - next[0] * point[1];
          }, 0);
          return signedArea < -0.001;
        });
      const averageDepth = face => face.reduce((sum, point) => sum + point[2], 0) / face.length;
      projected.sort((a, b) => averageDepth(a) - averageDepth(b));
      context.lineWidth = 1.4;
      context.lineJoin = 'round';
      for (const face of projected) {
        context.beginPath();
        face.forEach(([x, y], index) => index === 0 ? context.moveTo(x, y) : context.lineTo(x, y));
        context.closePath();
        context.fillStyle = '#050505';
        context.fill();
        context.strokeStyle = '#fff';
        context.stroke();
        if (face.eye) {
          // Draw on the capstone's front plane so the eye follows its rotation.
          const eyePoint = (x, y) => {
            const lidY = 0.76 + (y - 0.76) * blink.openness;
            return project([x, lidY, (1.2 - lidY) / 2], angles[0]);
          };
          const trace = (points, fill) => {
            context.beginPath();
            points.forEach(([x, y], index) => {
              const [px, py] = eyePoint(x, y);
              if (index === 0) context.moveTo(px, py);
              else context.lineTo(px, py);
            });
            context.closePath();
            if (fill) {
              context.fillStyle = fill;
              context.fill();
            } else context.stroke();
          };
          const outline = [];
          for (let step = 0; step <= 32; step++) {
            const t = step / 32;
            outline.push([-0.14 + 0.28 * t, 0.76 + 0.065 * Math.sin(Math.PI * t)]);
          }
          for (let step = 32; step >= 0; step--) {
            const t = step / 32;
            outline.push([-0.14 + 0.28 * t, 0.76 - 0.065 * Math.sin(Math.PI * t)]);
          }
          trace(outline, '#fff');
          trace(Array.from({length: 49}, (_, index) => {
            const theta = index / 48 * Math.PI * 2;
            return [0.038 * Math.cos(theta), 0.76 + 0.038 * Math.sin(theta)];
          }), '#050505');
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    loadTimelineEpochs().finally(() => {
      renderCosmicClock();
      scheduleCosmicClockJump();
    });
    showVoidComment();
    scheduleVoidComment();
  </script>
