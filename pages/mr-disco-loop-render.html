<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
        }

        .mr-disco-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .mr-disco-stage::before {
            content: '';
            position: absolute;
            inset: -35%;
            background: conic-gradient(
                from 0deg,
                #ff0055,
                #ffcc00,
                #0f0,
                #0ff,
                #6600ff,
                #ff0055
            );
            z-index: 0;
            transform: rotate(var(--chroma-rot, 0deg));
        }

        #disco-host {
            position: relative;
            z-index: 1;
            width: 88vmin;
            height: 88vmin;
        }

        #disco-host svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
    </style>
</head>
<body>
    <div class="mr-disco-stage" id="stage">
        <div id="disco-host"></div>
    </div>
    <script type="module">
        import { renderDiscoBallAtTime } from '../js/disco-ball-spin.js';
        import { applyDiscoBallEyeLayout, renderDiscoBallEyesSillyAtTime } from '../js/disco-ball-eyes.js';

        const DURATION = 15;
        const LOOP = {
            ballSpeed: (4 * Math.PI) / DURATION,
            bgSpeed: 8 / DURATION,
            initialBgPhase: 243,
            eyeSpinRate: (2 * Math.PI * 12) / DURATION,
        };

        const settings = {
            cx: 50,
            cy: 50,
            r: 42,
            checks: 12,
            tiltX: 0,
            strokeWidth: 1.5,
            fillDark: '#e6e6e6',
            chromaAmount: 0,
            chromaFalloff: 0.2,
            chromaAngle: 0,
            chromaOpacity: 0,
            chromaVariable: true,
            reflectStrength: 0.5,
            specularStrength: 0,
            trailLength: 0,
            scleraR: 12.3,
            pupilR: 9.1,
            eyeY: 50,
            eyeSpread: 13.5,
            eyeStroke: 2,
        };

        const params = new URLSearchParams(location.search);
        const elapsedSec = Math.max(0, Number.parseFloat(params.get('t') ?? '0') || 0);
        const loopT = ((elapsedSec % DURATION) + DURATION) % DURATION;

        async function init() {
            const host = document.getElementById('disco-host');
            const stage = document.getElementById('stage');
            const svgText = await fetch(new URL('../assets/icons/disco-ball.svg', import.meta.url)).then((r) => r.text());
            host.innerHTML = svgText;

            const svg = host.querySelector('svg');
            if (svg) {
                applyDiscoBallEyeLayout(svg, {
                    scleraR: settings.scleraR,
                    pupilR: settings.pupilR,
                    eyeY: settings.eyeY,
                    eyeLeftX: 50 - settings.eyeSpread,
                    eyeRightX: 50 + settings.eyeSpread,
                    strokeWidth: settings.eyeStroke,
                });
            }

            stage.style.setProperty('--chroma-rot', `${(loopT / DURATION) * 360}deg`);

            renderDiscoBallAtTime(host, loopT, {
                ...settings,
                speed: LOOP.ballSpeed,
                bgSpeed: LOOP.bgSpeed,
                initialBgPhase: LOOP.initialBgPhase,
            });

            renderDiscoBallEyesSillyAtTime(host, loopT, 'spin', {
                spinRate: LOOP.eyeSpinRate,
            });

            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            document.title = 'ready';
        }

        init().catch((err) => {
            console.error(err);
            document.title = 'error';
        });
    </script>
</body>
</html>
