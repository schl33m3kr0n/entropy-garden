<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Stupid Game — Entropy Garden</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='rotate(90 50 50)'><path d='M 10 50 C 30 20, 70 20, 90 50 C 70 80, 30 80, 10 50 Z' stroke='%230f0' stroke-width='4' fill='none' stroke-linejoin='round'/><circle cx='50' cy='50' r='24' stroke='%230f0' stroke-width='1.5' fill='none'/><circle cx='50' cy='50' r='14' stroke='%230f0' stroke-width='2' fill='none'/><circle cx='50' cy='50' r='5' fill='%230f0'/></g></svg>">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: var(--main-font);
      color-scheme: dark;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 12px;
      -webkit-font-smoothing: antialiased;
    }

    .chrome {
      position: fixed;
      z-index: 10;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(0, 255, 0, 0.72);
      pointer-events: none;
      user-select: none;
    }
    .chrome-tl { top: max(12px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); }
    .chrome-tr { top: max(12px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); text-align: right; }
    .chrome strong { color: rgba(0, 255, 0, 0.92); }
    .chrome .dim { color: rgba(0, 255, 0, 0.42); }

    main {
      width: min(460px, 96vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .ticker {
      min-height: 1.35em;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
    }
    .ticker strong { color: var(--neon-green, #0f0); }

    /* Top HUD strip: Die + Round + Pot + New */
    .hud-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(0, 255, 0, 0.28);
      border-radius: 6px;
      background: rgba(0, 14, 4, 0.7);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }

    .die-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--neon-green, #0f0);
    }

    .die-face {
      font-size: 1.25rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.22s ease;
    }
    .die-face.spin { transform: rotate(180deg) scale(1.15); }

    .pot-pill {
      color: #ffe45e;
      font-weight: 700;
    }

    /* 6 Player Checks Strip (3x2 grid) */
    .players-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .p-chip {
      appearance: none;
      border: 1px solid rgba(0, 255, 0, 0.25);
      border-radius: 5px;
      background: rgba(8, 16, 10, 0.9);
      color: #fff;
      font-family: inherit;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      cursor: pointer;
      font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .p-chip:hover:not(:disabled) {
      border-color: rgba(0, 255, 0, 0.75);
    }

    .p-chip.is-selected {
      border-color: #f7d800;
      box-shadow: 0 0 10px rgba(247, 216, 0, 0.28);
    }

    .p-chip.is-kill-target {
      border-color: #ff3355;
      background: rgba(45, 6, 16, 0.75);
    }

    .p-chip.is-dead {
      opacity: 0.32;
      cursor: default;
      text-decoration: line-through;
    }

    .p-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      display: inline-grid;
      place-items: center;
      font-size: 0.5rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .p-cr {
      color: var(--neon-green, #0f0);
      font-weight: 700;
    }

    /* Inline Popover Bar: Guess Color or Kill */
    .target-bar {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 10px;
      border: 1px solid rgba(0, 255, 0, 0.22);
      border-radius: 6px;
      background: rgba(4, 10, 5, 0.85);
      font-size: 0.68rem;
    }

    .swatches {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .swatch-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      padding: 0;
      position: relative;
    }
    .swatch-btn.is-active {
      border-color: #0f0;
      box-shadow: 0 0 8px #0f0;
      transform: scale(1.12);
    }
    .swatch-btn.is-out {
      opacity: 0.2;
    }

    /* 8x8 Board */
    .board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      aspect-ratio: 1;
      user-select: none;
    }

    .cell {
      position: relative;
      border: 1px solid rgba(0, 255, 0, 0.18);
      border-radius: 4px;
      background: rgba(6, 14, 8, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .cell:hover { border-color: rgba(0, 255, 0, 0.7); }
    .cell.is-you { border-color: #0f0; }
    .cell.is-dest { border-color: #f7d800; background: rgba(55, 48, 0, 0.55); }
    .cell.is-adj { border-color: rgba(255, 51, 85, 0.6); }

    .coord {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 0.44rem;
      color: rgba(255, 255, 255, 0.22);
      pointer-events: none;
    }

    .pieces {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: center;
      justify-content: center;
    }

    .piece {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      display: grid;
      place-items: center;
      font-size: 0.54rem;
      font-weight: 800;
    }
    .piece.mine {
      box-shadow: 0 0 0 2px #000, 0 0 0 3.5px #0f0;
    }

    /* Bottom Action Bar */
    .actions-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(0, 255, 0, 0.4);
      border-radius: 4px;
      background: rgba(0, 16, 0, 0.65);
      color: rgba(0, 255, 0, 0.92);
      font-family: inherit;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 10px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) {
      background: var(--neon-green, #0f0);
      color: #050505;
    }
    .btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }
    .btn--main {
      flex: 1;
      background: rgba(0, 255, 0, 0.18);
      border-color: #0f0;
      color: #fff;
      font-size: 0.72rem;
    }
    .btn--kill {
      border-color: #ff3355;
      color: #ff6b88;
      background: rgba(40, 0, 12, 0.65);
    }
    .btn--kill.is-on,
    .btn--kill:hover:not(:disabled) {
      background: #ff3355;
      color: #050505;
    }

    .garden-link {
      margin-top: 4px;
      padding: 7px 13px;
      border: 1px solid rgba(0, 255, 0, 0.32);
      border-radius: 4px;
      background: rgba(0, 12, 0, 0.5);
      color: rgba(0, 255, 0, 0.85);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .garden-link:hover {
      background: #0f0;
      color: #050505;
    }
  </style>
</head>
<body>
  <div class="chrome chrome-tl" aria-hidden="true">
    <strong>Entropy Garden</strong><br>
    <span class="dim">// the-stupid-game</span>
  </div>
  <div class="chrome chrome-tr" aria-hidden="true">
    1c move · 3c kill<br>
    <span class="dim">10c trial · 15c revive</span>
  </div>

  <main>
    <h1>THE STUPID GAME</h1>
    <div id="ticker" class="ticker" aria-live="polite">Roll the die to start Round 1.</div>

    <!-- Top Strip -->
    <div class="hud-bar">
      <span class="die-pill"><span id="die-face" class="die-face">🎲</span> <span id="round-text">R1</span></span>
      <span id="move-text">Move: 0c</span>
      <span id="pot-text" class="pot-pill">POT: 0c</span>
      <button type="button" id="btn-reset" class="btn" style="padding:3px 8px;">↻</button>
    </div>

    <!-- 6 Player Checks -->
    <div id="players-grid" class="players-grid"></div>

    <!-- Context Bar for Selected Player (Guess Color OR Kill) -->
    <div id="target-bar" class="target-bar"></div>

    <!-- 8x8 Board -->
    <div id="board" class="board" role="grid" aria-label="8 by 8 board"></div>

    <!-- Bottom Controls -->
    <div class="actions-bar">
      <button type="button" id="btn-donate" class="btn" disabled>+1c POT</button>
      <button type="button" id="btn-inf" class="btn" disabled>∞c</button>
      <button type="button" id="btn-trial" class="btn" disabled>⚖️ 10c</button>
      <button type="button" id="btn-revive" class="btn" disabled>✚ 15c</button>
      <button type="button" id="btn-main" class="btn btn--main">ROLL DIE</button>
    </div>

    <a class="garden-link" href="../index.html">← // return to the garden</a>
  </main>

  <script src="../js/boot/trophies.js"></script>
  <script>
    (function () {
      const COLORS = [
        { id: 'RED', label: 'Red', hex: '#ff3355', text: '#fff', short: 'R' },
        { id: 'YELLOW', label: 'Yellow', hex: '#f7d800', text: '#050505', short: 'Y' },
        { id: 'BLUE', label: 'Blue', hex: '#2490ff', text: '#fff', short: 'B' },
        { id: 'GREEN', label: 'Green', hex: '#00e65c', text: '#050505', short: 'G' },
        { id: 'BLACK', label: 'Black', hex: '#23232b', text: '#fff', short: 'K' },
        { id: 'WHITE', label: 'White', hex: '#f4f4f6', text: '#050505', short: 'W' },
      ];
      const COLOR_BY_ID = Object.fromEntries(COLORS.map((c) => [c.id, c]));
      const NAMES = ['YOU', 'ALICE', 'BOB', 'CHARLIE', 'DAVID', 'EVE'];
      const STARTS = [
        { col: 3, row: 3 }, { col: 1, row: 1 }, { col: 3, row: 5 },
        { col: 6, row: 1 }, { col: 5, row: 3 }, { col: 6, row: 5 },
      ];
      const DIE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

      const tickerEl = document.getElementById('ticker');
      const dieFaceEl = document.getElementById('die-face');
      const roundTextEl = document.getElementById('round-text');
      const moveTextEl = document.getElementById('move-text');
      const potTextEl = document.getElementById('pot-text');
      const playersGridEl = document.getElementById('players-grid');
      const targetBarEl = document.getElementById('target-bar');
      const boardEl = document.getElementById('board');
      const btnDonate = document.getElementById('btn-donate');
      const btnInf = document.getElementById('btn-inf');
      const btnTrial = document.getElementById('btn-trial');
      const btnRevive = document.getElementById('btn-revive');
      const btnMain = document.getElementById('btn-main');
      const btnReset = document.getElementById('btn-reset');

      let state = null;

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      const coordStr = (c, r) => `${String.fromCharCode(65 + c)}${r + 1}`;
      const dist = (a, b) => Math.abs(a.col - b.col) + Math.abs(a.row - b.row);

      function init() {
        const colors = shuffle(COLORS);
        const starts = shuffle(STARTS);
        const players = NAMES.map((name, id) => ({
          id,
          name,
          isHuman: id === 0,
          colorId: colors[id].id,
          credits: 3,
          col: starts[id].col,
          row: starts[id].row,
          alive: true,
          revealed: id === 0,
          ruledOut: new Set(),
        }));

        state = {
          round: 1,
          phase: 'roll', // 'roll' | 'orders' | 'over'
          pot: 0,
          players,
          selectedId: 1,
          guessColorId: COLORS[0].id,
          destCol: players[0].col,
          destRow: players[0].row,
          killId: null,
        };

        const myCol = COLOR_BY_ID[players[0].colorId];
        setTicker(`You are <strong>${myCol.label}</strong> @ <strong>${coordStr(players[0].col, players[0].row)}</strong>. Roll the die.`);
        pickDefaultSelection();
        render();
      }

      function setTicker(html) {
        tickerEl.innerHTML = html;
      }

      function survivors() {
        return state.players.filter((p) => p.alive);
      }

      function deadPlayers() {
        return state.players.filter((p) => !p.alive);
      }

      function knownColorSet() {
        return new Set(state.players.filter((p) => p.revealed || !p.alive).map((p) => p.colorId));
      }

      function pickDefaultSelection() {
        const me = state.players[0];
        state.destCol = me.col;
        state.destRow = me.row;
        state.killId = null;

        const others = survivors().filter((p) => p.id !== 0);
        if (!others.length) return;
        const cur = state.players[state.selectedId];
        if (!cur || !cur.alive || cur.id === 0) {
          state.selectedId = others[0].id;
        }
        syncDefaultGuessColor();
      }

      function syncDefaultGuessColor() {
        const target = state.players[state.selectedId];
        const known = knownColorSet();
        const valid = COLORS.find((c) => !known.has(c.id) && (!target || !target.ruledOut.has(c.id)));
        if (valid) state.guessColorId = valid.id;
      }

      // --- TURN STEP 1: ROLL DIE ---
      function rollDie() {
        const roll = 1 + Math.floor(Math.random() * 6);
        dieFaceEl.textContent = DIE_FACES[roll - 1];
        dieFaceEl.classList.add('spin');
        setTimeout(() => dieFaceEl.classList.remove('spin'), 220);

        survivors().forEach((p) => { p.credits += roll; });
        state.phase = 'orders';
        pickDefaultSelection();
        setTicker(`Rolled <strong>${roll}</strong> (+${roll}c each). Click a player to guess/kill &amp; tap board to move.`);
        render();
      }

      // --- SIMPLE UNIFIED AI ---
      function stepToward(from, to, steps) {
        let c = from.col, r = from.row, s = steps;
        while (s > 0 && (c !== to.col || r !== to.row)) {
          if (Math.abs(to.col - c) >= Math.abs(to.row - r) && c !== to.col) c += to.col > c ? 1 : -1;
          else if (r !== to.row) r += to.row > r ? 1 : -1;
          s--;
        }
        return { col: c, row: r };
      }

      function closestAdj(target, from) {
        const pts = [
          { col: target.col + 1, row: target.row },
          { col: target.col - 1, row: target.row },
          { col: target.col, row: target.row + 1 },
          { col: target.col, row: target.row - 1 },
        ].filter((p) => p.col >= 0 && p.col < 8 && p.row >= 0 && p.row < 8);
        pts.sort((a, b) => dist(from, a) - dist(from, b));
        return pts[0] || { col: target.col, row: target.row };
      }

      // --- TURN STEP 2: RESOLVE ORDERS ---
      function endTurn() {
        const me = state.players[0];
        const events = [];

        // 1. Human Guess
        if (me.alive && state.selectedId) {
          const target = state.players[state.selectedId];
          if (target && target.alive && !target.revealed) {
            const c = COLOR_BY_ID[state.guessColorId];
            if (target.colorId === state.guessColorId) {
              target.revealed = true;
              events.push(`You ID'd <strong>${target.name}</strong> (${c.label})!`);
            } else {
              target.ruledOut.add(state.guessColorId);
              events.push(`${target.name} ≠ ${c.label}.`);
            }
          }
        }

        // 2. AI Guesses (simple: pick 1 unrevealed opponent & 1 untried color)
        survivors().forEach((ai) => {
          if (ai.isHuman) return;
          const hidden = survivors().filter((p) => p.id !== ai.id && (!p.revealed || p.id === 0));
          if (!hidden.length) return;
          const target = hidden[Math.floor(Math.random() * hidden.length)];
          const known = new Set(
            state.players.filter((p) => p.id === ai.id || (p.revealed && p.id !== 0) || !p.alive).map((p) => p.colorId),
          );
          const pool = COLORS.filter((c) => !known.has(c.id) && !target.ruledOut.has(c.id));
          const pick = (pool.length ? pool : COLORS)[Math.floor(Math.random() * (pool.length || COLORS.length))];
          if (target.colorId === pick.id) {
            target.revealed = true;
            events.push(`<strong>${ai.name}</strong> ID'd <strong>${target.name}</strong>!`);
          } else {
            target.ruledOut.add(pick.id);
          }
        });

        // 3. Human Move
        if (me.alive) {
          const cost = dist(me, { col: state.destCol, row: state.destRow });
          if (cost > 0 && cost <= me.credits) {
            me.credits -= cost;
            me.col = state.destCol;
            me.row = state.destRow;
          }
        }

        // 4. Human Kill
        if (me.alive && state.killId !== null) {
          const victim = state.players[state.killId];
          if (victim && victim.alive && victim.revealed && me.credits >= 3) {
            if (dist(me, victim) > 1) {
              const adj = closestAdj(victim, me);
              const d = dist(me, adj);
              if (d + 3 <= me.credits) {
                me.credits -= d;
                me.col = adj.col;
                me.row = adj.row;
              }
            }
            if (dist(me, victim) === 1 && me.credits >= 3) {
              me.credits -= 3;
              killPlayer(victim, `🗡️ by YOU`, events);
            }
          }
        }

        // 5. AI Move & Kill (simple: chase nearest revealed player; kill if 1 space away & >= 3c)
        survivors().forEach((ai) => {
          if (ai.isHuman || !ai.alive) return;
          const targets = survivors().filter((p) => p.id !== ai.id && (p.id !== 0 ? p.revealed : p.ruledOut.size >= 3));
          const allOthers = survivors().filter((p) => p.id !== ai.id);
          const pool = targets.length ? targets : allOthers;
          if (!pool.length) return;

          pool.sort((a, b) => dist(ai, a) - dist(ai, b));
          const target = pool[0];
          const adj = closestAdj(target, ai);
          const d = dist(ai, adj);

          if (targets.includes(target) && d + 3 <= ai.credits) {
            ai.credits -= d + 3;
            ai.col = adj.col;
            ai.row = adj.row;
            killPlayer(target, `🗡️ by <strong>${ai.name}</strong>`, events);
          } else if (ai.credits > 3 && d > 0) {
            const step = stepToward(ai, adj, Math.min(2, ai.credits - 3));
            const moved = dist(ai, step);
            ai.credits -= moved;
            ai.col = step.col;
            ai.row = step.row;
          }
        });

        // 6. Simple AI Pot usage (Trial at 10c, Revive at 15c)
        if (survivors().length > 2 && state.pot >= 15 && deadPlayers().length && Math.random() < 0.35) {
          const revived = deadPlayers()[0];
          revivePlayer(revived, events);
        } else if (survivors().length > 2 && state.pot >= 10 && Math.random() < 0.4) {
          const alive = survivors();
          const accused = alive[Math.floor(Math.random() * alive.length)];
          runTrial(accused, events);
        }

        // 7. Check Game Over
        const left = survivors();
        if (left.length <= 1) {
          state.phase = 'over';
          const w = left[0] || me;
          setTicker(`🏆 <strong>${w.name}</strong> (${COLOR_BY_ID[w.colorId].label}) wins with ${w.credits}c!`);
          if (w.isHuman) globalThis.unlockTrophy?.('stupid_game');
          render();
          return;
        }

        state.round += 1;
        state.phase = 'roll';
        pickDefaultSelection();
        if (events.length) setTicker(events.slice(0, 2).join(' · '));
        else setTicker(`Round ${state.round} ready. Roll the die.`);
        render();
      }

      function killPlayer(victim, how, events) {
        victim.alive = false;
        victim.revealed = true;
        state.pot += victim.credits;
        events.push(`<strong>${victim.name}</strong> ${how} (+${victim.credits}c → Pot)`);
        victim.credits = 0;
      }

      function runTrial(accused, events) {
        if (state.pot < 10 || !accused.alive) return;
        state.pot -= 10;
        const voters = survivors();
        let yes = 0;
        voters.forEach((v) => {
          if (v.id === accused.id) return;
          if (v.isHuman || Math.random() < 0.6) yes++;
        });
        if (yes > voters.length / 2) {
          killPlayer(accused, `⚖️ convicted (${yes}/${voters.length})`, events);
        } else {
          events.push(`⚖️ <strong>${accused.name}</strong> acquitted (${yes}/${voters.length})`);
        }
      }

      function revivePlayer(target, events) {
        if (state.pot < 15 || target.alive) return;
        state.pot -= 15;
        target.alive = true;
        target.credits = 3;
        events.push(`✚ <strong>${target.name}</strong> revived (3c)`);
      }

      // --- RENDER ---
      function render() {
        const me = state.players[0];
        roundTextEl.textContent = `R${state.round}`;
        potTextEl.textContent = `POT: ${state.pot}c`;
        const moveCost = me.alive ? dist(me, { col: state.destCol, row: state.destRow }) : 0;
        const killCost = state.killId !== null ? 3 : 0;
        moveTextEl.textContent = me.alive ? `Cost: ${moveCost + killCost}/${me.credits}c` : 'SPECTATING';

        // 1. 6 Player Chips
        playersGridEl.innerHTML = state.players.map((p) => {
          const c = COLOR_BY_ID[p.colorId];
          const dot = p.revealed || !p.alive
            ? `<span class="dot" style="background:${c.hex};color:${c.text};">${c.short}</span>`
            : `<span class="dot" style="border-style:dashed;color:#888;">?</span>`;
          const sel = p.id === state.selectedId ? ' is-selected' : '';
          const kill = p.id === state.killId ? ' is-kill-target' : '';
          const dead = !p.alive ? ' is-dead' : '';
          return `<button type="button" class="p-chip${sel}${kill}${dead}" data-id="${p.id}" ${!p.alive ? 'disabled' : ''}>
            <span class="p-left">${dot}<span>${p.name}</span></span>
            <span class="p-cr">${p.credits}c</span>
          </button>`;
        }).join('');

        playersGridEl.querySelectorAll('.p-chip').forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.dataset.id);
            if (id === 0) return;
            state.selectedId = id;
            syncDefaultGuessColor();
            render();
          };
        });

        // 2. Context Bar for Selected Opponent
        const target = state.players[state.selectedId];
        const canAct = me.alive && state.phase === 'orders';
        if (!target || !target.alive || target.id === 0) {
          targetBarEl.innerHTML = `<span>Select an opponent above</span>`;
        } else if (!target.revealed) {
          const known = knownColorSet();
          const swatches = COLORS.map((c) => {
            const out = known.has(c.id) || target.ruledOut.has(c.id);
            const act = c.id === state.guessColorId;
            return `<button type="button" class="swatch-btn${act ? ' is-active' : ''}${out ? ' is-out' : ''}" data-col="${c.id}" style="background:${c.hex};" title="${c.label}" ${!canAct ? 'disabled' : ''}></button>`;
          }).join('');
          targetBarEl.innerHTML = `<span>Guess <strong>${target.name}</strong>:</span><div class="swatches">${swatches}</div>`;
          targetBarEl.querySelectorAll('.swatch-btn').forEach((b) => {
            b.onclick = () => {
              state.guessColorId = b.dataset.col;
              render();
            };
          });
        } else {
          const c = COLOR_BY_ID[target.colorId];
          const isKilling = state.killId === target.id;
          const d = dist({ col: state.destCol, row: state.destRow }, target);
          targetBarEl.innerHTML = `
            <span><strong>${target.name}</strong> is <strong style="color:${c.hex};">${c.label}</strong> @ ${coordStr(target.col, target.row)} (${d === 1 ? '1-space ✓' : `${d}sp`})</span>
            <button type="button" id="btn-toggle-kill" class="btn btn--kill${isKilling ? ' is-on' : ''}" ${!canAct || me.credits < 3 ? 'disabled' : ''}>
              ${isKilling ? '🗡️ KILL QUEUED (3c)' : '🗡️ KILL (3c)'}
            </button>
          `;
          const kBtn = document.getElementById('btn-toggle-kill');
          if (kBtn) {
            kBtn.onclick = () => {
              state.killId = isKilling ? null : target.id;
              if (state.killId !== null && dist({ col: state.destCol, row: state.destRow }, target) !== 1) {
                const adj = closestAdj(target, me);
                if (dist(me, adj) + 3 <= me.credits) {
                  state.destCol = adj.col;
                  state.destRow = adj.row;
                }
              }
              render();
            };
          }
        }

        // 3. 8x8 Board
        const cells = [];
        for (let r = 7; r >= 0; r--) {
          for (let c = 0; c < 8; c++) {
            const here = state.players.filter((p) => p.alive && p.col === c && p.row === r);
            const isYou = me.alive && me.col === c && me.row === r;
            const isDest = me.alive && state.destCol === c && state.destRow === r;
            const isAdj = me.alive && Math.abs(state.destCol - c) + Math.abs(state.destRow - r) === 1;
            const pieces = here.map((p) => {
              const col = COLOR_BY_ID[p.colorId];
              const label = p.revealed ? p.name[0] : col.short;
              return `<span class="piece${p.isHuman ? ' mine' : ''}" style="background:${col.hex};color:${col.text};">${label}</span>`;
            }).join('');
            cells.push(`<div class="cell${isYou ? ' is-you' : ''}${isDest ? ' is-dest' : ''}${isAdj ? ' is-adj' : ''}" data-c="${c}" data-r="${r}">
              <span class="coord">${coordStr(c, r)}</span>
              <div class="pieces">${pieces}</div>
            </div>`);
          }
        }
        boardEl.innerHTML = cells.join('');
        boardEl.querySelectorAll('.cell').forEach((cell) => {
          cell.onclick = () => {
            if (!canAct) return;
            const c = Number(cell.dataset.c);
            const r = Number(cell.dataset.r);
            const cost = dist(me, { col: c, row: r }) + (state.killId !== null ? 3 : 0);
            if (cost > me.credits) {
              setTicker(`Need ${cost}c (you have ${me.credits}c).`);
              return;
            }
            state.destCol = c;
            state.destRow = r;
            render();
          };
        });

        // 4. Bottom Action Buttons
        btnDonate.disabled = !(canAct && me.credits >= 1);
        btnInf.disabled = !canAct;
        btnTrial.disabled = !(canAct && state.pot >= 10 && target && target.alive && target.id !== 0);
        btnRevive.disabled = !(canAct && state.pot >= 15 && deadPlayers().length > 0);

        if (state.phase === 'over') btnMain.textContent = '↻ PLAY AGAIN';
        else if (state.phase === 'roll') btnMain.textContent = 'ROLL DIE';
        else btnMain.textContent = 'END TURN';
      }

      btnMain.onclick = () => {
        if (state.phase === 'over') init();
        else if (state.phase === 'roll') rollDie();
        else endTurn();
      };

      btnDonate.onclick = () => {
        const me = state.players[0];
        if (me.credits < 1) return;
        me.credits -= 1;
        state.pot += 1;
        setTicker(`Donated <strong>1c</strong> anonymously to the Pot.`);
        render();
      };

      btnInf.onclick = () => {
        setTicker(`<strong>DECLINED:</strong> Insufficient infinity (∞c).`);
      };

      btnTrial.onclick = () => {
        const target = state.players[state.selectedId];
        if (!target || !target.alive || target.id === 0 || state.pot < 10) return;
        const ev = [];
        runTrial(target, ev);
        setTicker(ev[0] || 'Trial complete.');
        if (survivors().length <= 1) state.phase = 'over';
        render();
      };

      btnRevive.onclick = () => {
        const dead = deadPlayers()[0];
        if (!dead || state.pot < 15) return;
        const ev = [];
        revivePlayer(dead, ev);
        setTicker(ev[0]);
        render();
      };

      btnReset.onclick = init;
      init();
    })();
  </script>
</body>
</html>
