<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Regular hexagram: outer radius 44, inner radius 22, centered at (50, 50) -->
  <rect width="100" height="100" fill="#f5f0e6" />

  <g stroke="#000000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Six congruent point triangles, clockwise from top -->
    <polygon points="50,6 61,30.95 39,30.95" fill="#e53935" />
    <polygon points="88.11,28 72,50 61,30.95" fill="#ff9800" />
    <polygon points="88.11,72 61,69.05 72,50" fill="#fdd835" />
    <polygon points="50,94 39,69.05 61,69.05" fill="#2e7d32" />
    <polygon points="11.89,72 28,50 39,69.05" fill="#1565c0" />
    <polygon points="11.89,28 39,30.95 28,50" fill="#6a1b9a" />

    <!-- Central hexagon -->
    <polygon points="61,30.95 72,50 61,69.05 39,69.05 28,50 39,30.95" fill="#000000" />
  </g>

  <!-- Eye: white sclera, black pupil -->
  <g transform="translate(50 50) scale(0.42) translate(-50 -50)">
    <path d="M 8 50 C 28 12, 72 12, 92 50 C 72 88, 28 88, 8 50 Z" fill="#ffffff" stroke="#000000" stroke-width="2.8" stroke-linejoin="round" />
    <circle cx="50" cy="50" r="14" fill="#000000" />
  </g>

  <!-- Letters centered in each point triangle -->
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="50" y="22.63">A</text>
    <text x="73.7" y="36.32">Y</text>
    <text x="73.7" y="63.68">C</text>
    <text x="50" y="77.37">Z</text>
    <text x="26.3" y="63.68">B</text>
    <text x="26.3" y="36.32">X</text>
  </g>
</svg>
