<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Regular hexagram: outer radius 44, inner radius 22, centered at (50, 50) -->
  <rect width="100" height="100" fill="#000000" />

  <!-- Six congruent point triangles, clockwise from top -->
  <polygon points="50,6 61,30.95 39,30.95" fill="#e53935" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />
  <polygon points="88.11,28 72,50 61,30.95" fill="#ff9800" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />
  <polygon points="88.11,72 61,69.05 72,50" fill="#fdd835" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />
  <polygon points="50,94 39,69.05 61,69.05" fill="#8e24aa" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />
  <polygon points="11.89,72 28,50 39,69.05" fill="#1565c0" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />
  <polygon points="11.89,28 39,30.95 28,50" fill="#43a047" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />

  <!-- Central hexagon (matches background) -->
  <polygon points="61,30.95 72,50 61,69.05 39,69.05 28,50 39,30.95" fill="#000000" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter" />

  <!-- Subtle eye outline, centered in the hexagon -->
  <g transform="translate(50 50) scale(0.42) translate(-50 -50)" stroke="#222222" stroke-width="2.8" fill="none" stroke-linecap="round">
    <path d="M 8 50 C 28 12, 72 12, 92 50 C 72 88, 28 88, 8 50 Z" />
    <circle cx="50" cy="50" r="14" />
  </g>
</svg>
