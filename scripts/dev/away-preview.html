<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Away preview — Entropy Garden</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/chrome.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: #000;
            color: var(--neon-green);
            font-family: monospace;
            padding: 2rem;
        }
        body.corrupted { color: var(--alert-red); }

        .label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            justify-content: center;
            align-items: flex-end;
        }

        .preview-wrap {
            width: min(220px, 72vw);
            text-align: center;
        }

        #panopticon-eye,
        #panopticon-eye-laptop {
            position: relative;
            opacity: 1;
            width: min(190px, 40vw);
            height: min(190px, 40vw);
            margin: 0.75rem auto 0;
            filter: drop-shadow(0 0 14px rgba(0, 255, 0, 0.35));
        }

        body.corrupted #panopticon-eye,
        body.corrupted #panopticon-eye-laptop {
            filter: drop-shadow(0 0 18px rgba(255, 0, 85, 0.45));
        }

        #panopticon-eye.away-reading .panopticon-away-scene,
        #panopticon-eye-laptop.away-reading .panopticon-away-scene {
            opacity: 1;
            visibility: visible;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            font: inherit;
            padding: 0.5rem 1rem;
            cursor: pointer;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <span class="label">Panopticon away props</span>

    <div class="row">
        <div class="preview-wrap">
            <div class="label">Book / newspaper</div>
            <div id="panopticon-eye" class="away-reading" aria-hidden="true">
                <div class="panopticon-inner" style="border: 2px solid currentColor; border-radius: 50%; aspect-ratio: 1;"></div>
                <div class="panopticon-away-scene" aria-hidden="true">
                    <div class="panopticon-away-book">
                        <span class="panopticon-away-book-icon" aria-hidden="true"></span>
                    </div>
                    <div class="panopticon-away-laptop">
                        <img class="panopticon-away-laptop-icon" src="../../assets/icons/laptop.png" alt="" width="128" height="128" decoding="async" aria-hidden="true">
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-wrap">
            <div class="label">Laptop</div>
            <div id="panopticon-eye-laptop" class="away-reading away-activity-laptop" aria-hidden="true">
                <div class="panopticon-inner" style="border: 2px solid currentColor; border-radius: 50%; aspect-ratio: 1;"></div>
                <div class="panopticon-away-scene" aria-hidden="true">
                    <div class="panopticon-away-book">
                        <span class="panopticon-away-book-icon" aria-hidden="true"></span>
                    </div>
                    <div class="panopticon-away-laptop">
                        <img class="panopticon-away-laptop-icon" src="../../assets/icons/laptop.png" alt="" width="128" height="128" decoding="async" aria-hidden="true">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button type="button" id="toggle-mode">Toggle corrupted</button>
    </div>

    <script>
        document.getElementById('toggle-mode').addEventListener('click', () => {
            document.body.classList.toggle('corrupted');
        });
    </script>
</body>
</html>
