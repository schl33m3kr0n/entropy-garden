<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault sphere — tweak preview (temp)</title>
    <style>
        :root {
            --neon-green: #0f0;
            --panel: #111;
            --border: #2a2a2a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: #050505;
            color: #cfcfcf;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--neon-green);
        }

        .meta {
            margin: 0 0 18px;
            color: #777;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(280px, 340px) 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }

        .controls {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            max-height: calc(100vh - 120px);
            overflow: auto;
        }

        .controls h2 {
            margin: 18px 0 10px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #666;
        }

        .controls h2:first-child { margin-top: 0; }

        label {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        label span.val {
            min-width: 52px;
            text-align: right;
            color: var(--neon-green);
            font-size: 0.75rem;
        }

        input[type="range"] { width: 100%; }

        .previews {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-block h2 {
            margin: 0 0 8px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #666;
        }

        .preview-frame {
            position: relative;
            background: #fff;
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 24px rgba(0, 255, 0, 0.15);
        }

        .preview-frame--thumb {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1;
        }

        .preview-frame--lightbox {
            width: min(100%, 560px);
            aspect-ratio: 1;
        }

        .vault-sphere-scene {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
        }

        .vault-sphere-starburst {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .vault-sphere-starburst polygon { fill: #000; }

        .vault-sphere-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }

        .vault-sphere-eyes {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }

        .vault-sphere-eye {
            height: auto;
            flex-shrink: 0;
        }

        .vault-sphere-eye-sclera { stroke: none; }
        .vault-sphere-eye--dark .vault-sphere-eye-sclera { fill: #000; }
        .vault-sphere-eye--light .vault-sphere-eye-sclera { fill: #fff; }
        .vault-sphere-eye-iris { fill: url(#preview-rainbow); }
        .vault-sphere-eye-pupil { fill: #0a0a0a; }

        .export {
            margin-top: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .export h2 {
            margin: 0 0 10px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #666;
        }

        pre {
            margin: 0;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 6px;
            overflow: auto;
            font-size: 0.72rem;
            line-height: 1.45;
            color: #9fdf9f;
            white-space: pre-wrap;
        }

        button {
            margin-top: 10px;
            padding: 8px 14px;
            background: #0a0a0a;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover { background: #141414; }
    </style>
</head>
<body>
    <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="preview-rainbow" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
                <stop offset="0%" stop-color="hsl(0, 100%, 50%)" />
                <stop offset="17%" stop-color="hsl(60, 100%, 50%)" />
                <stop offset="33%" stop-color="hsl(120, 100%, 50%)" />
                <stop offset="50%" stop-color="hsl(180, 100%, 50%)" />
                <stop offset="67%" stop-color="hsl(240, 100%, 50%)" />
                <stop offset="83%" stop-color="hsl(300, 100%, 50%)" />
                <stop offset="100%" stop-color="hsl(0, 100%, 50%)" />
            </linearGradient>
        </defs>
    </svg>

    <h1>Vault checkered sphere — tweak</h1>
    <p class="meta">
        Temporary preview · serve from repo root:
        <code>python3 -m http.server 8765</code> →
        <code>/docs/tmp-vault-sphere-preview.html</code>
    </p>

    <div class="layout">
        <aside class="controls" id="controls"></aside>

        <div class="previews">
            <div class="preview-block">
                <h2>Vault tile (~280px)</h2>
                <div class="preview-frame preview-frame--thumb" id="preview-thumb"></div>
            </div>
            <div class="preview-block">
                <h2>Lightbox (~560px)</h2>
                <div class="preview-frame preview-frame--lightbox" id="preview-lightbox"></div>
            </div>
        </div>
    </div>

    <div class="export">
        <h2>Copy values into production</h2>
        <pre id="export-snippet"></pre>
        <button type="button" id="copy-btn">Copy snippet</button>
    </div>

    <script type="module">
        const DEFAULTS = {
            sphereScale: 0.23,
            checks: 12,
            tiltX: 0.33,
            spinSpeed: 0.50,
            centerY: 0.50,
            focalMul: 1.5,
            starburstSize: 89,
            starburstSpin: 15,
            starburstOpacity: 1.00,
            starburstOuter: 46,
            starburstInner: 16,
            eyeWidth: 15,
            eyeGap: 4,
            lightX: 0.35,
            lightY: 0.55,
            lightZ: 0.75,
            blackBase: 10,
            blackRange: 32,
        };

        const settings = { ...DEFAULTS };
        let rotY = 0;
        let lastFrame = 0;
        let rainbowOffset = 0;

        const STAR_POLYGON = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        const previews = [];

        const SLIDERS = [
            { key: 'sphereScale', label: 'Sphere scale', min: 0.18, max: 0.42, step: 0.01 },
            { key: 'checks', label: 'Checker divisions', min: 4, max: 16, step: 1 },
            { key: 'tiltX', label: 'Tilt X (rad)', min: 0, max: 0.6, step: 0.01 },
            { key: 'spinSpeed', label: 'Spin speed', min: 0, max: 1.2, step: 0.05 },
            { key: 'centerY', label: 'Sphere center Y', min: 0.4, max: 0.6, step: 0.01 },
            { key: 'focalMul', label: 'Focal multiplier', min: 1.5, max: 3.5, step: 0.1 },
            { key: 'starburstSize', label: 'Starburst size %', min: 60, max: 120, step: 1 },
            { key: 'starburstSpin', label: 'Starburst spin (s)', min: 4, max: 40, step: 1 },
            { key: 'starburstOpacity', label: 'Starburst opacity', min: 0.3, max: 1, step: 0.02 },
            { key: 'starburstOuter', label: 'Starburst outer R', min: 30, max: 50, step: 1 },
            { key: 'starburstInner', label: 'Starburst inner R', min: 4, max: 24, step: 1 },
            { key: 'eyeWidth', label: 'Eye width %', min: 8, max: 24, step: 1 },
            { key: 'eyeGap', label: 'Eye gap %', min: 0, max: 20, step: 1 },
            { key: 'lightX', label: 'Light X', min: -1, max: 1, step: 0.05 },
            { key: 'lightY', label: 'Light Y', min: -1, max: 1, step: 0.05 },
            { key: 'lightZ', label: 'Light Z', min: 0, max: 1, step: 0.05 },
            { key: 'blackBase', label: 'Black base', min: 0, max: 40, step: 1 },
            { key: 'blackRange', label: 'Black lit range', min: 0, max: 80, step: 1 },
        ];

        function rotatePoint([x, y, z], rotX, rotY) {
            let nx = x, ny = y, nz = z;
            const cy = Math.cos(rotY), sy = Math.sin(rotY);
            const tx = nx * cy - nz * sy;
            const tz = nx * sy + nz * cy;
            nx = tx; nz = tz;
            const cx = Math.cos(rotX), sx = Math.sin(rotX);
            const ty = ny * cx - nz * sx;
            const tz2 = ny * sx + nz * cx;
            return [nx, ty, tz2];
        }

        function normalize(v) {
            const len = Math.hypot(v[0], v[1], v[2]) || 1;
            return [v[0] / len, v[1] / len, v[2] / len];
        }

        function dot(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }

        function rotatePointInverse([x, y, z], rotX, rotY) {
            let nx = x, ny = y, nz = z;
            const cx = Math.cos(-rotX), sx = Math.sin(-rotX);
            let ty = ny * cx - nz * sx;
            let tz = ny * sx + nz * cx;
            ny = ty; nz = tz;
            const cy = Math.cos(-rotY), sy = Math.sin(-rotY);
            const tx = nx * cy - nz * sy;
            tz = nx * sy + nz * cy;
            return [tx, ny, tz];
        }

        function checkerShade(lat, lon) {
            const u = ((lon / Math.PI) + 1) * 0.5;
            const v = (lat / Math.PI) + 0.5;
            return (Math.floor(u * settings.checks) + Math.floor(v * settings.checks)) % 2 === 0 ? 0 : 1;
        }

        function castSpherePixel(dx, dy, radius, focal, rotYVal) {
            const rd = normalize([dx, dy, focal]);
            const ro = [0, 0, -focal];
            const roL = rotatePointInverse(ro, settings.tiltX, -rotYVal);
            const rdL = rotatePointInverse(rd, settings.tiltX, -rotYVal);
            const b = 2 * dot(roL, rdL);
            const c = dot(roL, roL) - radius * radius;
            const disc = b * b - 4 * c;
            if (disc < 0) return null;
            const sqrtDisc = Math.sqrt(disc);
            const tNear = (-b - sqrtDisc) * 0.5;
            const tFar = (-b + sqrtDisc) * 0.5;

            let t = null;
            for (const cand of [tNear, tFar]) {
                if (cand >= 0) {
                    t = cand;
                    break;
                }
            }
            if (t == null) return null;

            const px = roL[0] + rdL[0] * t;
            const py = roL[1] + rdL[1] * t;
            const pz = roL[2] + rdL[2] * t;
            const nLocal = normalize([px, py, pz]);
            const nWorld = rotatePoint(nLocal, settings.tiltX, rotYVal);
            return {
                lat: Math.asin(Math.max(-1, Math.min(1, nLocal[1]))),
                lon: Math.atan2(nLocal[0], nLocal[2]),
                normal: nWorld,
            };
        }

        function shadePixel(hit, light) {
            if (checkerShade(hit.lat, hit.lon)) return [255, 255, 255];
            const lit = Math.max(0, dot(hit.normal, light));
            const v = Math.round(settings.blackBase + settings.blackRange * lit);
            return [v, v, v];
        }

        function drawSphereFrame(ctx, w, h, rotYVal) {
            const cx = w * 0.5;
            const cy = h * settings.centerY;
            const radius = Math.min(w, h) * settings.sphereScale;
            const focal = Math.max(w, h) * settings.focalMul;
            const light = normalize([settings.lightX, settings.lightY, settings.lightZ]);

            ctx.clearRect(0, 0, w, h);

            const yMin = Math.max(0, Math.floor(cy - radius - 1));
            const yMax = Math.min(h - 1, Math.ceil(cy + radius + 1));
            const xMin = Math.max(0, Math.floor(cx - radius - 1));
            const xMax = Math.min(w - 1, Math.ceil(cx + radius + 1));
            const iw = xMax - xMin + 1;
            const ih = yMax - yMin + 1;
            if (iw < 1 || ih < 1) return;

            const img = ctx.createImageData(iw, ih);
            const data = img.data;

            for (let py = yMin; py <= yMax; py++) {
                const dy = py - cy;
                for (let px = xMin; px <= xMax; px++) {
                    const hit = castSpherePixel(px - cx, dy, radius, focal, rotYVal);
                    if (!hit) continue;
                    const rgb = shadePixel(hit, light);
                    const idx = ((py - yMin) * iw + (px - xMin)) * 4;
                    data[idx] = rgb[0];
                    data[idx + 1] = rgb[1];
                    data[idx + 2] = rgb[2];
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(img, xMin, yMin);
        }

        function starburstPoints(outer, inner, cx = 50, cy = 50, n = 16) {
            const pts = [];
            for (let i = 0; i < n * 2; i++) {
                const r = i % 2 === 0 ? outer : inner;
                const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
                pts.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
            }
            return pts.join(' ');
        }

        function buildScene() {
            const scene = document.createElement('div');
            scene.className = 'vault-sphere-scene';

            const starSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            starSvg.setAttribute('class', 'vault-sphere-starburst');
            starSvg.setAttribute('viewBox', '0 0 100 100');
            const poly = STAR_POLYGON.cloneNode();
            starSvg.appendChild(poly);

            const canvas = document.createElement('canvas');
            canvas.className = 'vault-sphere-canvas';

            const eyes = document.createElement('div');
            eyes.className = 'vault-sphere-eyes';
            eyes.innerHTML = `
                <svg class="vault-sphere-eye vault-sphere-eye--dark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path class="vault-sphere-eye-sclera" d="M12 4.5C7 4.5 2.7 7.8 1 12c1.7 4.2 6 7.5 11 7.5s9.3-3.3 11-7.5c-1.7-4.2-6-7.5-11-7.5z"/>
                    <circle class="vault-sphere-eye-iris" cx="12" cy="12" r="4.5"/>
                    <circle class="vault-sphere-eye-pupil" cx="12" cy="12" r="1.6"/>
                </svg>
                <svg class="vault-sphere-eye vault-sphere-eye--light" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path class="vault-sphere-eye-sclera" d="M12 4.5C7 4.5 2.7 7.8 1 12c1.7 4.2 6 7.5 11 7.5s9.3-3.3 11-7.5c-1.7-4.2-6-7.5-11-7.5z"/>
                    <circle class="vault-sphere-eye-iris" cx="12" cy="12" r="4.5" transform="scale(-1 1) translate(-24 0)"/>
                    <circle class="vault-sphere-eye-pupil" cx="12" cy="12" r="1.6"/>
                </svg>
            `;

            scene.append(starSvg, canvas, eyes);
            return { scene, canvas, starSvg, eyes };
        }

        function applyDomStyles(entry) {
            const { starSvg, eyes } = entry;
            starSvg.style.width = `${settings.starburstSize}%`;
            starSvg.style.height = `${settings.starburstSize}%`;
            starSvg.style.opacity = settings.starburstOpacity;
            starSvg.querySelector('polygon').setAttribute(
                'points',
                starburstPoints(settings.starburstOuter, settings.starburstInner),
            );
            eyes.style.gap = `${settings.eyeGap}%`;
            eyes.querySelectorAll('.vault-sphere-eye').forEach((eye) => {
                eye.style.width = `${settings.eyeWidth}%`;
            });
        }

        function paintEntry(entry) {
            const canvas = entry.canvas;
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(1, Math.floor(rect.width * dpr));
            const h = Math.max(1, Math.floor(rect.height * dpr));
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
            drawSphereFrame(canvas.getContext('2d'), w, h, rotY);
        }

        function updateExport() {
            const s = settings;
            document.getElementById('export-snippet').textContent = `// js/modules/vault-sphere.js
const CHECKS = ${Math.round(s.checks)};
const TILT_X = ${s.tiltX.toFixed(2)};
const SPIN_SPEED = ${s.spinSpeed.toFixed(2)};
const SPHERE_SCALE = ${s.sphereScale.toFixed(2)};
// drawSphereFrame: centerY = h * ${s.centerY.toFixed(2)}, focal = max(w,h) * ${s.focalMul.toFixed(1)}
// shadePixel black: ${Math.round(s.blackBase)} + ${Math.round(s.blackRange)} * lit
// light: normalize([${s.lightX.toFixed(2)}, ${s.lightY.toFixed(2)}, ${s.lightZ.toFixed(2)}])

/* css/style.css */
.vault-sphere-starburst { width: ${Math.round(s.starburstSize)}%; height: ${Math.round(s.starburstSize)}%; opacity: ${s.starburstOpacity.toFixed(2)}; }
@keyframes vault-sphere-starburst { /* ${Math.round(s.starburstSpin)}s */ }
.vault-sphere-eyes { gap: ${Math.round(s.eyeGap)}%; }
.vault-sphere-eye { width: ${Math.round(s.eyeWidth)}%; }

/* index.html starburst polygon points= */
${starburstPoints(s.starburstOuter, s.starburstInner)}`;
        }

        function refresh() {
            previews.forEach((entry) => {
                applyDomStyles(entry);
                paintEntry(entry);
            });
            updateExport();
        }

        function buildControls() {
            const root = document.getElementById('controls');
            const groups = [
                { title: 'Sphere', keys: ['sphereScale', 'checks', 'tiltX', 'spinSpeed', 'centerY', 'focalMul'] },
                { title: 'Starburst', keys: ['starburstSize', 'starburstSpin', 'starburstOpacity', 'starburstOuter', 'starburstInner'] },
                { title: 'Eyes', keys: ['eyeWidth', 'eyeGap'] },
                { title: 'Lighting', keys: ['lightX', 'lightY', 'lightZ', 'blackBase', 'blackRange'] },
            ];

            groups.forEach((group) => {
                const h2 = document.createElement('h2');
                h2.textContent = group.title;
                root.appendChild(h2);

                group.keys.forEach((key) => {
                    const spec = SLIDERS.find((s) => s.key === key);
                    const label = document.createElement('label');
                    label.innerHTML = `${spec.label} <span class="val" data-for="${key}"></span>`;
                    const input = document.createElement('input');
                    input.type = 'range';
                    input.min = spec.min;
                    input.max = spec.max;
                    input.step = spec.step;
                    input.value = settings[key];
                    input.dataset.key = key;
                    input.addEventListener('input', () => {
                        settings[key] = key === 'checks'
                            ? Math.round(Number(input.value))
                            : Number(input.value);
                        label.querySelector('.val').textContent = formatVal(key, settings[key]);
                        refresh();
                    });
                    label.appendChild(input);
                    label.querySelector('.val').textContent = formatVal(key, settings[key]);
                    root.appendChild(label);
                });
            });

            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.textContent = 'Reset defaults';
            resetBtn.addEventListener('click', () => {
                Object.assign(settings, DEFAULTS);
                root.querySelectorAll('input[type="range"]').forEach((input) => {
                    const key = input.dataset.key;
                    input.value = settings[key];
                    const valEl = root.querySelector(`.val[data-for="${key}"]`);
                    if (valEl) valEl.textContent = formatVal(key, settings[key]);
                });
                refresh();
            });
            root.appendChild(resetBtn);
        }

        function formatVal(key, val) {
            if (key === 'checks') return String(Math.round(val));
            if (Number.isInteger(val)) return String(val);
            return val.toFixed(2);
        }

        function initPreview(containerId) {
            const frame = document.getElementById(containerId);
            const entry = buildScene();
            frame.appendChild(entry.scene);
            previews.push(entry);
            return entry;
        }

        buildControls();
        initPreview('preview-thumb');
        initPreview('preview-lightbox');

        document.getElementById('copy-btn').addEventListener('click', async () => {
            const text = document.getElementById('export-snippet').textContent;
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById('copy-btn').textContent = 'Copied!';
                setTimeout(() => { document.getElementById('copy-btn').textContent = 'Copy snippet'; }, 1200);
            } catch {
                document.getElementById('copy-btn').textContent = 'Copy failed';
            }
        });

        let starburstAngle = 0;
        function tick(now) {
            const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.05) : 0;
            lastFrame = now;
            rotY += settings.spinSpeed * dt;
            rainbowOffset = (rainbowOffset + dt * 20) % 200;
            const cycle = (rainbowOffset / 2) % 100;
            document.getElementById('preview-rainbow')?.setAttribute('gradientTransform', `translate(${-cycle}, 0)`);

            starburstAngle += (360 / settings.starburstSpin) * dt;
            previews.forEach((entry) => {
                entry.starSvg.style.transform = `translate(-50%, -50%) rotate(${starburstAngle}deg)`;
                paintEntry(entry);
            });

            requestAnimationFrame(tick);
        }

        refresh();
        requestAnimationFrame(tick);
    </script>
</body>
</html>
