<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cards of Chaos — deck preview (temp)</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #050505;
            color: #cfcfcf;
            font-family: 'Courier New', Courier, monospace;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #0f0;
        }

        .preview-meta {
            margin: 0 0 20px;
            font-size: 0.78rem;
            color: #888;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 18px 14px;
            max-width: 1100px;
        }

        .preview-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .preview-cell .coc-card {
            pointer-events: none;
            cursor: default;
        }

        .preview-label {
            font-size: 0.62rem;
            line-height: 1.35;
            letter-spacing: 0.04em;
            color: rgba(200, 200, 200, 0.72);
            text-align: center;
            max-width: 88px;
            word-break: break-word;
        }

        .preview-suit-key {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            margin-bottom: 22px;
            font-size: 0.72rem;
            color: #aaa;
        }

        .preview-suit-key span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .preview-suit-key i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h1>Cards of Chaos — full deck</h1>
    <p class="preview-meta">Temporary preview · 52 cards · serve via <code>bash scripts/dev/serve-local.sh</code> then open <code>/docs/tmp-cards-preview.html</code></p>
    <div class="preview-suit-key" id="suit-key"></div>
    <div id="grid" class="preview-grid"></div>

    <script type="module">
        import {
            buildDeck,
            SUITS,
            icosahedronShapeSvg,
            cardKey,
        } from '../js/data/cards-of-chaos.data.js';

        function shapeSvg(suitId, variant) {
            if (suitId === 'wild') {
                const fill = variant === 'white' ? '#f8f8f8' : '#111';
                const stroke = variant === 'white' ? '#333' : '#888';
                return `<svg viewBox="0 0 24 24" class="coc-shape coc-shape-circle" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
            }
            const s = SUITS[suitId];
            if (suitId === 'tri') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,4 20,20 4,20" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'sq') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'dia') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,3 21,12 12,21 3,12" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'pent') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,2 22,9 18,21 6,21 2,9" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'hex') {
                return icosahedronShapeSvg(s.color);
            }
            return '';
        }

        function cardFaceHtml(card) {
            const rankLabel = card.suit === 'wild' ? '' : String(card.rank);
            const wideRank = rankLabel.length > 1 ? ' is-wide' : '';
            const centerShape = shapeSvg(card.suit, card.variant);
            return `
                <span class="coc-card-corner coc-card-corner-tl">
                    <span class="coc-rank${wideRank}">${rankLabel}</span>
                </span>
                <span class="coc-card-center">${centerShape}</span>
                <span class="coc-card-corner coc-card-corner-br">
                    <span class="coc-rank${wideRank}">${rankLabel}</span>
                </span>
            `;
        }

        function renderCard(card) {
            const el = document.createElement('div');
            el.className = 'coc-card';
            el.setAttribute('role', 'img');

            el.innerHTML = cardFaceHtml(card);
            el.style.setProperty('--coc-accent', SUITS[card.suit]?.accent || '#ccc');
            return el;
        }

        const suitKey = document.getElementById('suit-key');
        for (const [id, s] of Object.entries(SUITS)) {
            if (id === 'wild') continue;
            const item = document.createElement('span');
            item.innerHTML = `<i style="background:${s.color}"></i>${s.label} (${s.dieLabel})`;
            suitKey.appendChild(item);
        }
        const wildItem = document.createElement('span');
        wildItem.textContent = 'Wild ×2 (⚫ / ⚪)';
        suitKey.appendChild(wildItem);

        const grid = document.getElementById('grid');
        const deck = buildDeck();

        for (const card of deck) {
            const cell = document.createElement('div');
            cell.className = 'preview-cell';

            const suitLabel = card.suit === 'wild'
                ? `wild ${card.variant}`
                : `${SUITS[card.suit].dieLabel} · ${SUITS[card.suit].label}`;

            cell.appendChild(renderCard(card));
            const label = document.createElement('div');
            label.className = 'preview-label';
            label.textContent = `${cardKey(card)} · ${suitLabel}`;
            cell.appendChild(label);
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
