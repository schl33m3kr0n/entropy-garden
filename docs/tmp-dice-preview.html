<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cards of Chaos — dice preview (temp)</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #050505;
            color: #cfcfcf;
            font-family: 'Courier New', Courier, monospace;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #0f0;
        }

        h2 {
            margin: 28px 0 12px;
            font-size: 0.82rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #888;
        }

        .preview-meta {
            margin: 0 0 20px;
            font-size: 0.78rem;
            color: #888;
        }

        .preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start;
        }

        .preview-note {
            margin: 8px 0 0;
            font-size: 0.72rem;
            color: #666;
            max-width: 640px;
        }
    </style>
</head>
<body>
    <h1>Cards of Chaos — dice faces</h1>
    <p class="preview-meta">Temporary preview · serve from repo root: <code>python3 -m http.server 8765</code> → <code>/docs/tmp-dice-preview.html</code></p>

    <h2>All values by die</h2>
    <div id="by-die"></div>

    <h2>Special faces (revealed)</h2>
    <div id="special" class="preview-row"></div>
    <p class="preview-note">Face 6 → hex wedge · face 9 → Sierpiński triangle. Both tint via <code>--die-accent</code> to match the die suit.</p>

    <h2>Roll states</h2>
    <div id="states" class="preview-row"></div>

    <script type="module">
        import {
            SUITS,
            hexWedgeFaceSvg,
            sierpinskiFaceSvg,
            icosaCornerSvg,
            isDieSixFace,
            isDieNineFace,
        } from '../js/data/cards-of-chaos.data.js';

        const DICE = [
            { suitId: 'tri', sides: 4 },
            { suitId: 'sq', sides: 6 },
            { suitId: 'dia', sides: 8 },
            { suitId: 'pent', sides: 12 },
            { suitId: 'hex', sides: 20 },
        ];

        function shapeSvg(suitId) {
            if (suitId === 'wild') {
                return `<svg viewBox="0 0 24 24" class="coc-shape coc-shape-circle" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#111" stroke="#888" stroke-width="2"/></svg>`;
            }
            const s = SUITS[suitId];
            if (suitId === 'tri') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,4 20,20 4,20" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'sq') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'dia') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,3 21,12 12,21 3,12" fill="${s.color}"/></svg>`;
            }
            if (suitId === 'pent') {
                return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,2 22,9 18,21 6,21 2,9" fill="${s.color}"/></svg>`;
            }
            return `<svg viewBox="0 0 24 24" class="coc-shape" aria-hidden="true"><polygon points="12,2 18,8 20,16 14,22 10,22 4,16 6,8" fill="${s.color}"/></svg>`;
        }

        function dieCornerShapeSvg(suitId) {
            if (suitId === 'hex') {
                return icosaCornerSvg('--die-accent');
            }
            return shapeSvg(suitId);
        }

        function dieFaceMarkup(roll, showValue) {
            if (!showValue) return `<span class="coc-die-value">?</span>`;
            if (isDieSixFace(roll)) {
                return `<span class="coc-die-art coc-hex-wedge-art">${hexWedgeFaceSvg('--die-accent')}</span>`;
            }
            if (isDieNineFace(roll)) {
                return `<span class="coc-die-art coc-sierpinski-art">${sierpinskiFaceSvg('--die-accent')}</span>`;
            }
            return `<span class="coc-die-value">${roll.value}</span>`;
        }

        function renderDie(roll) {
            const el = document.createElement('div');
            el.className = 'coc-die';
            if (roll.spinning) el.classList.add('is-spinning');
            if (roll.revealed) el.classList.add('is-revealed');
            if (roll.kept === true) el.classList.add('is-kept');
            if (roll.kept === false) el.classList.add('is-dropped');
            if (roll.role === 'wild') el.classList.add('is-wild');

            const accent = SUITS[roll.suitId]?.color || '#ccc';
            const showValue = roll.revealed && !roll.spinning;

            el.innerHTML = `
                <div class="coc-die-body" style="--die-accent: ${accent}">
                    ${dieFaceMarkup(roll, showValue)}
                    ${dieCornerShapeSvg(roll.suitId)}
                </div>
                <span class="coc-die-tag">${roll.label}${roll.role === 'wild' ? ' · wild' : ''}</span>
            `;
            return el;
        }

        function makeRoll(suitId, value, opts = {}) {
            const sides = SUITS[suitId].sides;
            return {
                suitId,
                sides,
                value,
                role: opts.role || 'primary',
                label: SUITS[suitId].dieLabel,
                kept: opts.kept ?? null,
                revealed: opts.revealed ?? true,
                spinning: opts.spinning ?? false,
            };
        }

        const byDie = document.getElementById('by-die');
        for (const { suitId, sides } of DICE) {
            const section = document.createElement('div');
            section.style.marginBottom = '18px';

            const title = document.createElement('h2');
            title.style.margin = '0 0 10px';
            title.style.fontSize = '0.75rem';
            title.textContent = `${SUITS[suitId].label} (${SUITS[suitId].dieLabel})`;
            section.appendChild(title);

            const row = document.createElement('div');
            row.className = 'preview-row';
            for (let value = 1; value <= sides; value++) {
                row.appendChild(renderDie(makeRoll(suitId, value)));
            }
            section.appendChild(row);
            byDie.appendChild(section);
        }

        const special = document.getElementById('special');
        special.appendChild(renderDie(makeRoll('sq', 6)));
        special.appendChild(renderDie(makeRoll('dia', 6)));
        special.appendChild(renderDie(makeRoll('pent', 9)));
        special.appendChild(renderDie(makeRoll('hex', 9)));

        const states = document.getElementById('states');
        states.appendChild(renderDie(makeRoll('sq', 4, { revealed: false, spinning: true })));
        states.appendChild(renderDie(makeRoll('dia', 7, { revealed: true })));
        states.appendChild(renderDie(makeRoll('hex', 16, { revealed: true, kept: true })));
        states.appendChild(renderDie(makeRoll('tri', 2, { revealed: true, kept: false })));
        states.appendChild(renderDie(makeRoll('sq', 6, { revealed: true, kept: true, role: 'wild' })));
    </script>
</body>
</html>
